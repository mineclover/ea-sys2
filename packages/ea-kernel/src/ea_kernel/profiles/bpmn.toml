# BPMN 2.0 Kernel Profile
#
# 27 elements, 8 relations, 49 rules (27 allow + 8 deny + 14 builder-generated fallback)
# 8 categories → 8 kernel types (missing: datatype, feature, state)

[profile]
name = "BPMN"
version = "2.0"
kernel_version = "2.5.0"
id_prefix = "bp"
standard = "BPMN 2.0"
organization = "OMG"

[categories]
Activity = "step"
Task = "action"
Event = "event"
Gateway = "expression"
Participant = "structure"
Data = "item"
Container = "package"
Connector = "port"

# ═══════════════════════════════════════════════════════════════════
# Elements — 27 BPMN 2.0 elements across 3 layers
# ═══════════════════════════════════════════════════════════════════

# ── Orchestration Layer (19) ──────────────────────────────────────

# Activity (2) — step
[[elements]]
name = "Process"
layer = "Orchestration"
category = "Activity"
description = "Top-level process container for activities"

[[elements]]
name = "SubProcess"
layer = "Orchestration"
category = "Activity"
description = "Embedded process within a process"

# Task (5) — action
[[elements]]
name = "Task"
layer = "Orchestration"
category = "Task"
description = "Atomic work unit within a process"

[[elements]]
name = "ServiceTask"
layer = "Orchestration"
category = "Task"
description = "Task invoking an external service"

[[elements]]
name = "UserTask"
layer = "Orchestration"
category = "Task"
description = "Task performed by a human with system assistance"

[[elements]]
name = "ScriptTask"
layer = "Orchestration"
category = "Task"
description = "Task executing an automated script"

[[elements]]
name = "BusinessRuleTask"
layer = "Orchestration"
category = "Task"
description = "Task evaluating a business rule"

# Event (8) — event
[[elements]]
name = "StartEvent"
layer = "Orchestration"
category = "Event"
description = "Process initiation trigger"

[[elements]]
name = "EndEvent"
layer = "Orchestration"
category = "Event"
description = "Process termination point"

[[elements]]
name = "IntermediateThrowEvent"
layer = "Orchestration"
category = "Event"
description = "Event thrown during process execution"

[[elements]]
name = "IntermediateCatchEvent"
layer = "Orchestration"
category = "Event"
description = "Event caught during process execution"

[[elements]]
name = "BoundaryEvent"
layer = "Orchestration"
category = "Event"
description = "Event attached to an activity boundary"

[[elements]]
name = "TimerEvent"
layer = "Orchestration"
category = "Event"
description = "Time-triggered event"

[[elements]]
name = "MessageEvent"
layer = "Orchestration"
category = "Event"
description = "Message-triggered event"

[[elements]]
name = "ErrorEvent"
layer = "Orchestration"
category = "Event"
description = "Error-triggered event"

# Gateway (4) — expression
[[elements]]
name = "ExclusiveGateway"
layer = "Orchestration"
category = "Gateway"
description = "XOR routing — exactly one path"

[[elements]]
name = "ParallelGateway"
layer = "Orchestration"
category = "Gateway"
description = "AND routing — all paths"

[[elements]]
name = "InclusiveGateway"
layer = "Orchestration"
category = "Gateway"
description = "OR routing — one or more paths"

[[elements]]
name = "EventBasedGateway"
layer = "Orchestration"
category = "Gateway"
description = "Routing based on event occurrence"

# ── Collaboration Layer (6) ───────────────────────────────────────

# Participant (2) — structure
[[elements]]
name = "Pool"
layer = "Collaboration"
category = "Participant"
description = "Participant container in a collaboration"

[[elements]]
name = "Lane"
layer = "Collaboration"
category = "Participant"
description = "Sub-partition within a pool for role assignment"

# Data (1) — item
[[elements]]
name = "Message"
layer = "Collaboration"
category = "Data"
description = "Communication payload between participants"

# Container (2) — package
[[elements]]
name = "Collaboration"
layer = "Collaboration"
category = "Container"
description = "Top-level collaboration container"

[[elements]]
name = "Choreography"
layer = "Collaboration"
category = "Container"
description = "Multi-party interaction specification"

# Connector (1) — port
[[elements]]
name = "MessageEndpoint"
layer = "Collaboration"
category = "Connector"
description = "Communication endpoint for message exchange"

# ── DataFlow Layer (2) ────────────────────────────────────────────

# Data (2) — item
[[elements]]
name = "DataObject"
layer = "DataFlow"
category = "Data"
description = "Data produced or consumed by activities"

[[elements]]
name = "DataStore"
layer = "DataFlow"
category = "Data"
description = "Persistent data repository"

# ═══════════════════════════════════════════════════════════════════
# Relations — 8 BPMN 2.0 relationship types → 7 kernel relations
# ═══════════════════════════════════════════════════════════════════

[[relations]]
name = "sequenceFlow"
kernel_relation = "succession"
description = "Temporal ordering of flow objects"

[[relations]]
name = "messageFlow"
kernel_relation = "flow"
description = "Message exchange between pools"

[[relations]]
name = "dataAssociation"
kernel_relation = "flow"
description = "Data input/output between data and activities"

[[relations]]
name = "bpmnAssociation"
kernel_relation = "association"
description = "Artifact linkage to flow objects"

[[relations]]
name = "composition"
kernel_relation = "ownership"
description = "Subprocess containment"

[[relations]]
name = "containment"
kernel_relation = "membership"
description = "Pool/Lane containment"

[[relations]]
name = "eventTrigger"
kernel_relation = "triggering"
description = "Event triggers activity"

[[relations]]
name = "bpmnSpecialization"
kernel_relation = "specialization"
description = "Type refinement"

# ═══════════════════════════════════════════════════════════════════
# Validity Rules
# ═══════════════════════════════════════════════════════════════════

