# EA System: Recursive Node (Input/Output/Logic) Self-Description
# Goal: Node = { Input, Output, Logic }, Logic contains Nodes (recursive)
# 기존 80-development.toml 과 동일 프로젝트를 재귀 노드 패턴으로 재모델링
#
# 검증 대상:
#   1. 주소 체계 — 중첩 노드를 고유하게 참조할 수 있는가?
#   2. 상호작용 정의 — 경계를 넘는 데이터 흐름을 표현할 수 있는가?
#   3. 적정 추상화 — 프로젝션 레벨별로 재귀 깊이가 제어되는가?

[profile]
name = "EASystem-RecursiveNode"
version = "0.1.0"
kernel_version = "2.5.0"
id_prefix = "rn"
standard = "Recursive Node Pattern v0.1"
organization = "ea-system"

# ── Projection Overrides ──────────────────────────────────────
# max_containment_depth per level: 재귀 구조의 점진적 노출
#   L0: 최상위 노드만 (depth 0)
#   L1: 1단계 중첩까지 (패키지 노드)
#   L2+: 제한 없음 (모듈 레벨 이하 전부)
[projection]
max_containment_depth_l0 = 0
max_containment_depth_l1 = 1

# ── Category → Kernel Entity 매핑 ────────────────────────────
# 주의: 프로젝션 필터가 표준 카테고리 이름으로 동작하므로
#       커스텀 이름 대신 표준 EA 카테고리 사용 필수.
#
# 프로젝션 레벨별 가시성:
#   L0: Composite, InputInterface, OutputInterface, Context, Goal, Governance
#   L1: + Assessment, Behavior, Executable
#   L3: + PassiveStructure, Event
#   L4: 전부
#
# 재귀 노드 패턴의 점진적 노출 전략:
#   Node     → Composite        (L0부터 — 경계 보임)
#   In Port  → InputInterface   (L0부터 — 수신 접점)
#   Out Port → OutputInterface  (L0부터 — 송신 접점)
#   Logic    → Behavior         (L1부터 — 내부 로직은 한 단계 아래서)
#   Data     → PassiveStructure (L3부터 — 데이터 흐름은 실행 레벨에서)
#   Gate     → Assessment       (L1부터 — 품질 게이트)
[categories]
Composite = "structure"           # Node: 계산 노드 (경계 컨테이너)
InputInterface = "input_port"     # In: 수신 포트
OutputInterface = "output_port"   # Out: 송신 포트
Behavior = "package"              # Logic: 내부 로직 컨테이너 (재귀 핵심)
PassiveStructure = "item"         # Data: 노드 간 데이터 채널
Assessment = "expression"         # Gate: 품질 검증 게이트

# ── Relations (10 standard) ──────────────────────────────────
[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Node contains I/O ports and Logic; Logic contains sub-Nodes."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency between Nodes."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Data flow: OutputPort → InputPort (cross-boundary wiring)."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Node produces DataChannel."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Node consumes DataChannel."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "QualityGate constrains execution."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration between nodes."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Port exposed at parent boundary."

