# ══════════════════════════════════════════════════════════════
# N1 Vocabulary — Frozen Value Objects (types.py)
# ══════════════════════════════════════════════════════════════

[[elements]]
name = "NeedCatalog"
layer = "Needs"
category = "Composite"
description = "Aggregate root containing use-cases, stakeholders, needs, relations, and process units. All mutations go through catalog methods (DDD aggregate pattern)."

[[elements]]
name = "Stakeholder"
layer = "Needs"
category = "PassiveStructure"
description = "Frozen value object: the subject who has the need. Fields: id, name, role, context."

[[elements]]
name = "Desire"
layer = "Needs"
category = "PassiveStructure"
description = "Frozen value object: what the stakeholder wants. Fields: action, subject, target (optional)."

[[elements]]
name = "Justification"
layer = "Needs"
category = "PassiveStructure"
description = "Frozen value object: why the stakeholder has this desire. Fields: type (BECAUSE/IN_ORDER_TO), description."

[[elements]]
name = "NeedStatement"
layer = "Needs"
category = "PassiveStructure"
description = "Frozen composite: complete immutable expression of a stakeholder need. Combines stakeholder_id + desire + justifications + kernel_refs + tags + purpose + cause_types + complexity."

[[elements]]
name = "UseCase"
layer = "Needs"
category = "PassiveStructure"
description = "Frozen value object: structured use-case with actor, situation, purpose, outcome, tags, and version."

[[elements]]
name = "Need"
layer = "Needs"
category = "PassiveStructure"
description = "Mutable lifecycle wrapper around frozen NeedStatement. Manages status, priority, version, lineage_id, decision evidence refs, and timestamps."

[[elements]]
name = "NeedRelation"
layer = "Needs"
category = "PassiveStructure"
description = "Directed relationship between two needs. Fields: id, source_id, target_id, type (DEPENDS_ON/CONFLICTS_WITH/SUPPORTS/REFINES/SUPERSEDES), description."

[[elements]]
name = "NeedProcessUnit"
layer = "Needs"
category = "PassiveStructure"
description = "Frozen modeling unit for need processes. Fields: id, need_id, stage (IDENTIFY/QUERY/MODEL_DETAIL), label, description, sequence, metadata."

