# ArchiMate 3.2 Kernel Profile
#
# 58 elements, 11 relations, 44 rules (36 allow + 8 deny, NO fallback rules)
# 17 categories → 11 kernel types

[profile]
name = "ArchiMate"
version = "3.2"
kernel_version = "2.5.0"
id_prefix = "am"
standard = "ArchiMate 3.2"
organization = "The Open Group"

[categories]
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Event = "event"
PassiveStructure = "item"
Composite = "package"
Executable = "action"
Goal = "state"
Outcome = "state"
Assessment = "expression"
Constraint = "expression"
Driver = "feature"
Principle = "feature"
Requirement = "feature"
Junction = "feature"
Meaning = "datatype"
Value = "datatype"

