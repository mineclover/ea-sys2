description = "GovernanceSchema 유효성 검사 및 조건 레지스트리 바인딩이 포함된 거버넌스 프로필 로딩 브리지입니다."

[elements.ConditionRegistryService]
display_name = "상태 등록 서비스"
description = "4가지 거버넌스별 조건(SAME_LAYER, SAME_LIFECYCLE, SAME_POLICY_SCOPE, SAME_TRANSACTION)으로 커널 기본 조건을 확장합니다."

[elements.GovernanceLayerStorePort]
display_name = "거버넌스 레이어 저장소 포트"
description = "거버넌스 관리 모델 페이로드(save_payload, get_payload, list_snapshots)를 위한 인프라 정의 레이어 범위 저장소 ABC입니다."

[elements.GovernanceKernelStore]
display_name = "거버넌스 커널 저장소"
description = "레이어 범위 저장소를 통해 구현된 규칙 자산, 코퍼스 버전 및 판단을 위한 커널 스냅샷 저장소입니다."

[elements.GovernanceNeedsStore]
display_name = "거버넌스 요구 저장"
description = "JSON 직렬화를 사용하여 레이어 범위 거버넌스 저장소에 구축된 카탈로그 지속성 어댑터가 필요합니다."

[elements.GovernanceSchemaRecord]
display_name = "거버넌스 스키마 기록"
description = "14개 엔터티와 10개 관계가 있는 고정된 데이터 클래스 스키마 정의(GOVERNANCE_SCHEMA 싱글톤)입니다."

[elements.LayerSnapshotRecord]
display_name = "레이어 스냅샷 기록"
description = "레이어 범위 모델 스냅샷(layer, model_id, payload,update_at)을 나타내는 고정된 데이터 클래스입니다."

[elements.TransactionUnitRecord]
display_name = "거래단위기록"
description = "ACID 작업 추적을 위한 트랜잭션 단위 데이터 클래스(id, 이름, tx_type, 상태, 페이로드, 로그)."

[elements.TransactionEventRecord]
display_name = "거래 이벤트 기록"
description = "트랜잭션 감사를 위한 고정된 이벤트 소싱 레코드(id, tx_id, event_type, message, payload, Created_at)."

[elements.TransactionStatusRecord]
display_name = "거래현황기록"
description = "트랜잭션 상태 열거 값: PENDING, IN_PROGRESS, COMMITTED, ROLLED_BACK, FAILED."

[elements.GenerationSuggestionRecord]
display_name = "세대 제안 기록"
description = "MetaGenerator 출력: 제안된 결정 주제, 커널 작업, 흐름 사양 및 토폴로지 일치."

[elements.RuleAssetSnapshotRecord]
display_name = "규칙 자산 스냅샷 레코드"
description = "GovernanceKernelStore(규칙, 메타데이터, 출처, 수명주기)에 의해 유지되는 커널 규칙 자산 스냅샷입니다."

[elements.JudgmentSnapshotRecord]
display_name = "판결 스냅샷 기록"
description = "GovernanceKernelStore(평결, 증거, reference_stats)에 의해 유지되는 커널 판단 스냅샷입니다."

[elements.CorpusVersionSnapshotRecord]
display_name = "코퍼스 버전 스냅샷 기록"
description = "GovernanceKernelStore(version_id, rule_count, rule_ids)에 의해 유지되는 커널 코퍼스 버전 스냅샷입니다."

[elements.NeedsCatalogSnapshotRecord]
display_name = "카탈로그 스냅샷 기록이 필요합니다."
description = "레이어 저장소를 통해 GovernanceNeedsStore에서 유지되는 카탈로그 JSON 스냅샷이 필요합니다."

[elements.KernelRuleEndpoint]
display_name = "커널 규칙 끝점"
description = "커널 규칙 수명주기 작업(제출, 승인, 거부, 사용 중단)에 대한 끝점 계약입니다."

[elements.KernelEvaluateEndpoint]
display_name = "커널 평가 끝점"
description = "커널 판단 평가(소스, 타겟, 관계)를 위한 엔드포인트 계약입니다."

[elements.KernelSnapshotEndpoint]
display_name = "커널 스냅샷 끝점"
description = "커널 코퍼스 스냅샷 생성 및 버전 목록을 위한 엔드포인트 계약입니다."

[elements.NeedsCatalogEndpoint]
display_name = "카탈로그 엔드포인트 필요"
description = "카탈로그 CRUD(생성, 표현, 수정, 프로세스 단위 추가)가 필요한 엔드포인트 계약입니다."

[elements.LayerSnapshotEndpoint]
display_name = "레이어 스냅샷 끝점"
description = "일반 레이어 스냅샷 저장/가져오기/목록 작업을 위한 엔드포인트 계약입니다."

[elements.GovernanceDashboardEndpoint]
display_name = "거버넌스 대시보드 엔드포인트"
description = "거버넌스_service.py 순수 함수 쿼리(대시보드, 레이어 세부정보, 레이어 간 요약)에 대한 엔드포인트 계약입니다."

[elements.TransactionPolicy]
display_name = "거래정책"
description = "트랜잭션 ACID에 대한 정책 제약은 이벤트 소싱 무결성을 보장합니다."

[elements.RuleSubmitStep]
display_name = "규칙 제출 단계"
description = "트랜잭션 래핑을 사용하여 KernelRuleOps를 통한 커널 규칙 제출 단계입니다."

[elements.RuleApprovalStep]
display_name = "규칙 승인 단계"
description = "KernelRuleOps를 통한 커널 규칙 승인/거부 결정 단계."

[elements.KernelEvaluationStep]
display_name = "커널 평가 단계"
description = "GovernanceSystem.evaluate를 통해 EnhancedJudgment를 생성하는 커널 판단 평가 단계입니다."

[elements.CorpusSnapshotStep]
display_name = "코퍼스 스냅샷 단계"
description = "버전 정보를 GovernanceKernelStore에 유지하는 커널 코퍼스 스냅샷 생성 단계입니다."

[elements.NeedsCatalogWriteStep]
display_name = "카탈로그 쓰기 단계 필요"
description = "지속 및 커밋을 통한 카탈로그 변형 단계(생성, 표현, 수정, 프로세스 단위 추가)가 필요합니다."

[elements.DecisionTraceWriteStep]
display_name = "결정 추적 쓰기 단계"
description = "운영, 증거, 이력을 축적하는 의사결정 추적 기록/업데이트 단계입니다."

[elements.LayerSnapshotWriteStep]
display_name = "레이어 스냅샷 쓰기 단계"
description = "6개 레이어 DB 중 하나에 대한 일반 레이어 스냅샷 쓰기 단계입니다."

[elements.GovernanceDeprecateRuleAction]
display_name = "거버넌스 사용 중단 규칙 조치"
description = "이유 및 트랜잭션 추적을 포함한 거버넌스를 통해 커널 규칙을 더 이상 사용하지 않습니다."

[elements.InterpretReportAction]
display_name = "보고서 작업 해석"
description = "DesignReport 모델링 작업을 흐름 워크플로 사양으로 변환하고 런타임을 통해 해석합니다."

[elements.InterpretUseCaseAction]
display_name = "사용 사례 작업 해석"
description = "거버넌스 트랜잭션 래핑을 사용하여 ea-flow 런타임을 통해 UseCaseSpec을 해석합니다."

[elements.KernelRuleSubmittedEvent]
display_name = "커널 규칙 제출 이벤트"
description = "거버넌스(event_type: kernel_rule_submitted)를 통해 커널 규칙이 제출될 때 발생합니다."

[elements.KernelRuleApprovedEvent]
display_name = "커널 규칙 승인 이벤트"
description = "거버넌스를 통해 커널 규칙이 승인되면 발생합니다(event_type: kernel_rule_approved)."

[elements.KernelRuleRejectedEvent]
display_name = "커널 규칙 거부 이벤트"
description = "거버넌스를 통해 커널 규칙이 거부되면 발생합니다(event_type: kernel_rule_rejected)."

[elements.KernelRuleDeprecatedEvent]
display_name = "커널 규칙 더 이상 사용되지 않는 이벤트"
description = "거버넌스를 통해 커널 규칙이 더 이상 사용되지 않을 때 발생합니다(event_type: kernel_rule_deprecated)."

[elements.KernelJudgmentRecordedEvent]
display_name = "커널 판단 기록 이벤트"
description = "커널 판단이 실행되고 스냅샷이 생성될 때 발생합니다(event_type: kernel_judgment_recorded)."

[elements.KernelSnapshotCreatedEvent]
display_name = "커널 스냅샷 생성 이벤트"
description = "커널 코퍼스 스냅샷이 생성될 때 발생합니다(event_type: kernel_snapshot_created)."

[elements.DecisionTraceLinkEvent]
display_name = "결정 추적 링크 이벤트"
description = "모델 작업이 결정 추적(event_type: Decision_trace_linked)에 연결될 때 발생합니다."

[elements.NeedsCatalogCreatedEvent]
display_name = "카탈로그 생성 이벤트 필요"
description = "요구 카탈로그가 생성될 때 발생합니다(event_type: need_catalog_created)."

[elements.NeedsExpressedEvent]
display_name = "표현된 이벤트가 필요함"
description = "카탈로그에 요구가 표현될 때 발생합니다(event_type: need_expressed)."

[elements.TransactionBeginEvent]
display_name = "거래 시작 이벤트"
description = "거버넌스 트랜잭션이 시작될 때 발생합니다(event_type: 시작)."

[elements.TransactionCommitEvent]
display_name = "트랜잭션 커밋 이벤트"
description = "거버넌스 트랜잭션이 성공적으로 커밋되면 발생합니다(event_type: commit)."

[elements.TransactionFailEvent]
display_name = "거래 실패 이벤트"
description = "거버넌스 트랜잭션이 실패할 때 발생합니다(event_type: 실패)."

