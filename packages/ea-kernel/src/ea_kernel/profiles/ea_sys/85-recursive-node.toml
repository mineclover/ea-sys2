# ══════════════════════════════════════════════════════════════
# RULES: Cross-Boundary Wiring (OutputPort → InputPort)
# 주소 체계 검증: 점 표기법으로 경계를 명시적으로 참조
# ══════════════════════════════════════════════════════════════

# Profile.out → Kernel.in  (ProfileData flows)
[[rules]]
id = "rn-wire-pk"
source = "Profile.out"
target = "Kernel.in"
relation = "next"
priority = 72
notes = "Profile output wired to Kernel input (KernelProfile data)."

# Kernel.out → Projection.in  (TopologyData flows)
[[rules]]
id = "rn-wire-kp"
source = "Kernel.out"
target = "Projection.in"
relation = "next"
priority = 72
notes = "Kernel output wired to Projection input (topology data)."

# Decision.out → Kernel.in  (decision feedback)
[[rules]]
id = "rn-wire-dk"
source = "Decision.out"
target = "Kernel.in"
relation = "next"
priority = 72
notes = "Decision output wired to Kernel input (modeling actions)."

# Needs.out → Decision.in  (needs→decision trigger)
[[rules]]
id = "rn-wire-nd"
source = "Needs.out"
target = "Decision.in"
relation = "next"
priority = 72
notes = "Needs output wired to Decision input (goals, context)."

# Flow.out → Kernel.in  (flow feedback)
[[rules]]
id = "rn-wire-fk"
source = "Flow.out"
target = "Kernel.in"
relation = "next"
priority = 72
notes = "Flow execution result fed back to Kernel."

# Governance.out → EASys2.out  (dashboard surfaces to system output)
[[rules]]
id = "rn-wire-go"
source = "Governance.out"
target = "EASys2.out"
relation = "next"
priority = 72
notes = "Governance dashboard surfaces to system output."

# Projection.out → EASys2.out  (projections surface to system output)
[[rules]]
id = "rn-wire-po"
source = "Projection.out"
target = "EASys2.out"
relation = "next"
priority = 72
notes = "Projected views surface to system output."

# EASys2.in → Kernel.in  (user requests routed to kernel)
[[rules]]
id = "rn-wire-sk"
source = "EASys2.in"
target = "Kernel.in"
relation = "next"
priority = 72
notes = "System input routed to Kernel."

# EASys2.in → Governance.in  (admin requests routed to governance)
[[rules]]
id = "rn-wire-sg"
source = "EASys2.in"
target = "Governance.in"
relation = "next"
priority = 72
notes = "System input routed to Governance."

