# EA System Layer: Flow
# Role: 실행/데이터 흐름 모델 정의

[profile]
name = "EASystemLayerModel"
version = "0.4.1"
kernel_version = "2.5.0"
id_prefix = "eas"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"
Context = "state"
Page = "structure"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership between components and ports."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration linkage."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency on data or policies."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Behavior produces artifacts."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Behavior consumes artifacts."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence transition."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy or guard constrains execution."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience or element."

[[elements]]
name = "FlowLayer"
layer = "Flow"
category = "Composite"
description = "Flow modeling boundary and runtime chain terminal stage."

[[elements]]
name = "InfraModelPort"
layer = "Infra"
category = "Interface"
description = "6x6 contract port for infra-layer model interface."

[[elements]]
name = "GovernanceModelPort"
layer = "Governance"
category = "Interface"
description = "6x6 contract port for governance-layer model interface."

[[elements]]
name = "DecisionModelPort"
layer = "Decision"
category = "Interface"
description = "6x6 contract port for decision-layer model interface."

[[elements]]
name = "NeedsModelPort"
layer = "Needs"
category = "Interface"
description = "6x6 contract port for needs-layer model interface."

[[elements]]
name = "KernelModelPort"
layer = "Kernel"
category = "Interface"
description = "6x6 contract port for kernel-layer model interface."

[[elements]]
name = "FlowModelPort"
layer = "Flow"
category = "Interface"
description = "6x6 contract port for flow-layer model interface."

[[elements]]
name = "ContextIngestStep"
layer = "Flow"
category = "Behavior"
description = "Collects initial needs context handed off from upstream decision/needs modeling."

[[elements]]
name = "NormalizeNeedStep"
layer = "Flow"
category = "Behavior"
description = "Normalizes needs and constraint information."

[[elements]]
name = "BuildKernelInputStep"
layer = "Flow"
category = "Behavior"
description = "Builds kernel-ready input payload."

[[elements]]
name = "MapKernelSpecStep"
layer = "Flow"
category = "Behavior"
description = "Maps payload to active kernel contract/version from kernel-stage handoff."

[[elements]]
name = "ExecuteKernelAction"
layer = "Flow"
category = "Executable"
description = "Executes contracted work/action."

[[elements]]
name = "VerifyOutcomeStep"
layer = "Flow"
category = "Behavior"
description = "Verifies execution output against expected constraints."

[[elements]]
name = "PersistFlowStateStep"
layer = "Flow"
category = "Behavior"
description = "Persists flow state/validation traces and publishes layer-contract matrix ownership."

[[elements]]
name = "PublishFlowOutcomeAction"
layer = "Flow"
category = "Executable"
description = "Publishes final flow outcome snapshots."

[[elements]]
name = "LayerVersionStore"
layer = "Infra"
category = "PassiveStructure"
description = "Infra version store consumed by flow mapping."

[[elements]]
name = "ValidationRunStore"
layer = "Infra"
category = "PassiveStructure"
description = "Infra validation store consumed/updated by flow."

[[elements]]
name = "UseCaseCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Needs use-case catalog consumed by flow ingestion."

[[elements]]
name = "ActorContextCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Needs actor context consumed by flow ingestion."

[[elements]]
name = "ConstraintCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Needs constraints consumed by normalization."

[[elements]]
name = "PrioritizedNeedSet"
layer = "Needs"
category = "PassiveStructure"
description = "Prioritized needs consumed by planning steps."

[[elements]]
name = "FlowPlanningPolicy"
layer = "Flow"
category = "Assessment"
description = "Flow-local policy for planning and kernel input composition."

[[elements]]
name = "FlowExecutionPolicy"
layer = "Flow"
category = "Assessment"
description = "Flow-local policy for execution and verification safety."

[[elements]]
name = "KernelInputDraft"
layer = "Flow"
category = "PassiveStructure"
description = "Intermediate kernel input draft produced by flow."

[[elements]]
name = "ContractedPlanDraft"
layer = "Flow"
category = "PassiveStructure"
description = "Kernel-contracted plan draft used for execution."

[[elements]]
name = "FlowLayerContractMatrix"
layer = "Flow"
category = "PassiveStructure"
description = "Flow-owned 6x6 cross-layer contract matrix (single owner artifact)."

[[rules]]
source = "@Composite"
target = "@Behavior"
relation = "contains"
priority = 50
notes = "Flow boundary contains behavior steps."

[[rules]]
source = "@Composite"
target = "@Executable"
relation = "contains"
priority = 50
notes = "Flow boundary contains executable actions."

[[rules]]
source = "@Composite"
target = "@PassiveStructure"
relation = "contains"
priority = 50
notes = "Flow boundary contains flow artifacts and imported datasets."

[[rules]]
source = "@Behavior"
target = "@Behavior"
relation = "next"
priority = 50
notes = "Behavior step to step transition."

[[rules]]
source = "@Behavior"
target = "@Executable"
relation = "next"
priority = 50
notes = "Behavior to executable transition."

[[rules]]
source = "@Executable"
target = "@Behavior"
relation = "next"
priority = 50
notes = "Executable to behavior transition."

[[rules]]
source = "@Executable"
target = "@Executable"
relation = "next"
priority = 50
notes = "Executable to executable chaining."

[[rules]]
source = "@Behavior"
target = "@PassiveStructure"
relation = "produces"
priority = 50
notes = "Behavior steps produce artifacts."

[[rules]]
source = "@Executable"
target = "@PassiveStructure"
relation = "produces"
priority = 50
notes = "Actions produce artifacts."

[[rules]]
source = "@PassiveStructure"
target = "@Behavior"
relation = "consumes"
priority = 50
notes = "Behavior steps consume datasets."

[[rules]]
source = "@PassiveStructure"
target = "@Executable"
relation = "consumes"
priority = 50
notes = "Actions consume datasets."

[[rules]]
source = "@Behavior"
target = "@Assessment"
relation = "depends_on"
priority = 50
notes = "Behavior steps depend on flow-local policy schemas."

[[rules]]
source = "@Executable"
target = "@Assessment"
relation = "depends_on"
priority = 50
notes = "Actions depend on flow-local policy schemas."

[[rules]]
source = "@Assessment"
target = "@Behavior"
relation = "constrains"
priority = 50
notes = "Flow-local assessment models constrain behavior steps."

[[rules]]
source = "@Assessment"
target = "@Executable"
relation = "constrains"
priority = 50
notes = "Flow-local assessment models constrain executable actions."

[[rules]]
source = "@Behavior"
target = "@PassiveStructure"
relation = "depends_on"
priority = 50
notes = "Behavior steps depend on passive data state."

[[rules]]
source = "@Executable"
target = "@PassiveStructure"
relation = "depends_on"
priority = 50
notes = "Actions depend on passive data state."

