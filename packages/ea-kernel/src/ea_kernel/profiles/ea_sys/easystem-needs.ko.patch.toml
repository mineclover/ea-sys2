[relations.registers]
display_name = "등록"
description = "요소를 카탈로그나 레지스트리에 등록하는 관계입니다."

[relations.coordinates]
display_name = "조율"
description = "복수 요소의 협업 동작을 조정하는 관계입니다."

[relations.depends_on]
display_name = "의존"
description = "한 요소가 다른 요소에 의존하는 관계입니다."

[relations.produces]
display_name = "생산"
description = "산출물 또는 상태를 생성하는 관계입니다."

[relations.consumes]
display_name = "소비"
description = "산출물 또는 상태를 입력으로 소비하는 관계입니다."

[relations.next]
display_name = "다음"
description = "순차 흐름에서 다음 단계로 이어지는 관계입니다."

[relations.triggers]
display_name = "트리거"
description = "조건/이벤트가 다음 동작을 촉발하는 관계입니다."

[relations.constrains]
display_name = "제약"
description = "정책/규칙이 대상 동작을 제한하는 관계입니다."

[relations.available_in]
display_name = "가용"
description = "특정 컨텍스트에서 요소가 사용 가능함을 나타냅니다."

