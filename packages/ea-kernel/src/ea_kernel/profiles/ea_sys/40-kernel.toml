priority = 70
notes = "Published event can trigger follow-up review."

[[rules]]
source = "KernelProfileRegistry"
target = "KernelSpecSnapshot"
relation = "depends_on"
priority = 70
notes = "Registry depends on spec snapshots."

[[rules]]
source = "KernelProfileRegistry"
target = "KernelRuleSet"
relation = "depends_on"
priority = 70
notes = "Registry depends on compiled rule sets."

[[rules]]
source = "KernelContractService"
target = "KernelProfileRegistry"
relation = "depends_on"
priority = 70
notes = "Contract service depends on profile registry state."

[[rules]]
source = "PublishKernelContractAction"
