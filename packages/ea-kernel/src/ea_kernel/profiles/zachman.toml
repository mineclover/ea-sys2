target = "@Who"
relation = "derives_from"
priority = 40
notes = "Who column derivation"

[[rules]]
id = "zf-deriv-05"
source = "@When"
target = "@When"
relation = "derives_from"
priority = 40
notes = "When column derivation"

[[rules]]
id = "zf-deriv-06"
source = "@Why"
target = "@Why"
relation = "derives_from"
priority = 40
notes = "Why column derivation"

