[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-kernel-contract"
version = "0.2.0"
description = "Contract snapshot consumer for ea-kernel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["ea-kernel", "contract", "snapshot", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ea_kernel_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_kernel_contract"
