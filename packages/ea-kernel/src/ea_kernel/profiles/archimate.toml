description = "Temporal causal relationship"

[[relations]]
name = "Flow"
kernel_relation = "flow"
description = "Transfer of data or material"

[[relations]]
name = "Specialization"
kernel_relation = "specialization"
description = "Element is a specialization of another"

[[relations]]
name = "Association"
kernel_relation = "association"
description = "Unspecified structural relationship"

# ═══════════════════════════════════════════════════════════════════
# Validity Rules — 36 allow + 8 deny = 44 explicit rules
# ═══════════════════════════════════════════════════════════════════

# ── Composition (ownership): ActiveStructure owns PassiveStructure/Interface ──

[[rules]]
id = "am-comp-01"
source = "@ActiveStructure"
target = "@PassiveStructure"
relation = "Composition"
priority = 40
notes = "Active structure composes passive structure"

[[rules]]
id = "am-comp-02"
source = "@ActiveStructure"
target = "@Interface"
relation = "Composition"
priority = 40
notes = "Active structure composes interface"

[[rules]]
id = "am-comp-03"
source = "@ActiveStructure"
target = "@Behavior"
relation = "Composition"
priority = 40
notes = "Active structure composes behavior"

[[rules]]
id = "am-comp-04"
source = "@Composite"
target = "@Behavior"
relation = "Composition"
priority = 40
notes = "Composite composes behavior"

[[rules]]
id = "am-comp-05"
source = "@Composite"
target = "@ActiveStructure"
relation = "Composition"
priority = 40
notes = "Composite composes active structure"

# ── Aggregation (membership): broader containment ─────────────────

[[rules]]
id = "am-agg-01"
source = "@ActiveStructure"
target = "@ActiveStructure"
relation = "Aggregation"
priority = 40
notes = "Active structure aggregates active structure"

[[rules]]
id = "am-agg-02"
source = "@Composite"
target = "@ActiveStructure"
relation = "Aggregation"
priority = 40
notes = "Composite aggregates active structure"

[[rules]]
