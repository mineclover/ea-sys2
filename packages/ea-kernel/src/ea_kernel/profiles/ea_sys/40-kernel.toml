[[rules]]
source = "KernelValidationService"
target = "KernelSpecSnapshot"
relation = "produces"
priority = 70
notes = "Validation produces reviewed kernel spec snapshots."

[[rules]]
source = "ContractReviewStep"
target = "KernelSpecSnapshot"
relation = "consumes"
priority = 70
