category = "PassiveStructure"
description = "Catalog of decision node types (context, option, evaluation, outcome)."

[[elements]]
name = "DecisionRelationTypeCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of relation types among decision nodes."

[[elements]]
name = "DecisionStateCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of states used in decision lifecycle modeling."

[[elements]]
name = "DecisionContextRecord"
layer = "Decision"
