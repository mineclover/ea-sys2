# EA System Layer: Kernel
# Role: 도메인 핵심 모델 정의

[profile]
name = "EASystemLayerModel"
version = "0.4.1"
kernel_version = "2.5.0"
id_prefix = "eas"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"
Context = "state"
Page = "structure"

# ── Relations ──────────────────────────────────────────────

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership between components and ports."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration linkage."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency on data or policies."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Behavior produces artifacts."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Behavior consumes artifacts."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence transition."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy or guard constrains execution."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience or element."

# ── Elements: Implementation ───────────────────────────────

[[elements]]
name = "KernelLayer"
layer = "Kernel"
category = "Composite"
description = "Kernel specification boundary and runtime chain third stage."

[[elements]]
name = "KernelContractService"
layer = "Kernel"
category = "ActiveStructure"
description = "Publishes canonical kernel contracts for downstream layers."

[[elements]]
name = "KernelRuleCompiler"
layer = "Kernel"
category = "ActiveStructure"
description = "Compiles kernel-level validity rule sets."

[[elements]]
name = "KernelValidationService"
layer = "Kernel"
category = "ActiveStructure"
description = "Validates model payloads against kernel contracts."

[[elements]]
name = "KernelProfileRegistry"
layer = "Kernel"
category = "ActiveStructure"
description = "Indexes kernel profile artifacts and active references."

[[elements]]
name = "KernelContractPort"
layer = "Kernel"
category = "Interface"
description = "Port for reading kernel contract snapshots."

[[elements]]
name = "InfraModelPort"
layer = "Infra"
category = "Interface"
description = "6x6 contract port for infra-layer model interface."

[[elements]]
name = "GovernanceModelPort"
layer = "Governance"
category = "Interface"
description = "6x6 contract port for governance-layer model interface."

[[elements]]
name = "DecisionModelPort"
layer = "Decision"
category = "Interface"
description = "6x6 contract port for decision-layer model interface."

[[elements]]
name = "NeedsModelPort"
layer = "Needs"
category = "Interface"
description = "6x6 contract port for needs-layer model interface."

[[elements]]
name = "KernelModelPort"
layer = "Kernel"
category = "Interface"
description = "6x6 contract port for kernel-layer model interface."

[[elements]]
name = "FlowModelPort"
layer = "Flow"
category = "Interface"
description = "Flow model port used as downstream handoff target from kernel."

[[elements]]
name = "KernelCapabilityModel"
layer = "Kernel"
category = "PassiveStructure"
description = "Canonical capability model derived from kernel rules."

[[elements]]
name = "KernelRuleSet"
layer = "Kernel"
category = "PassiveStructure"
description = "Compiled kernel rule set artifacts."

[[elements]]
name = "KernelSpecSnapshot"
layer = "Kernel"
category = "PassiveStructure"
description = "Versioned kernel specification snapshot."

[[elements]]
name = "KernelConsistencyGoal"
layer = "Kernel"
category = "Goal"
description = "Goal for consistency of kernel contracts and validation outcomes."

[[elements]]
name = "ContractReviewStep"
layer = "Kernel"
category = "Behavior"
description = "Reviews compiled contracts before publication."

[[elements]]
name = "PublishKernelContractAction"
layer = "Kernel"
category = "Executable"
description = "Publishes reviewed kernel contract artifacts for flow-stage execution."

[[elements]]
name = "KernelSpecPublishedEvent"
layer = "Kernel"
category = "Event"
description = "Raised when a new kernel spec snapshot is published."

# ── Elements: Context (환경 조건) ──────────────────────────

[[elements]]
name = "ModelAuthorContext"
layer = "Kernel"
category = "Context"
description = "User context for authoring and evolving kernel models."

[[elements]]
name = "ModelExplorerContext"
layer = "Kernel"
category = "Context"
description = "User context for exploring kernel topology, rules, and relations."

[[elements]]
name = "ModelValidatorContext"
layer = "Kernel"
category = "Context"
description = "User context for validating model integrity and contract compliance."

# ── Elements: Experience (경험 경계) ───────────────────────

[[elements]]
name = "KernelModelingExperience"
layer = "Kernel"
category = "Composite"
description = "Experience boundary for kernel model authoring journey."

[[elements]]
name = "KernelExplorationExperience"
layer = "Kernel"
category = "Composite"
description = "Experience boundary for kernel topology and rule exploration journey."

[[elements]]
name = "KernelValidationExperience"
layer = "Kernel"
category = "Composite"
description = "Experience boundary for model validation journey."

# ── Elements: Page (사용자 진입 뷰) ────────────────────────

[[elements]]
name = "KernelTopologyPage"
layer = "Kernel"
category = "Page"
description = "Graph view of kernel elements, relations, and traversal paths."

[[elements]]
name = "KernelRuleBrowserPage"
layer = "Kernel"
category = "Page"
description = "Rule search, detail view, and coverage analysis."

[[elements]]
name = "KernelProfileEditorPage"
layer = "Kernel"
category = "Page"
description = "Profile TOML editing, preview, and validation trigger."

# ── Elements: Endpoint (API 진입점) ────────────────────────

[[elements]]
name = "KernelQueryEndpoint"
layer = "Kernel"
category = "Interface"
description = "API endpoint for querying kernel graph and topology."

[[elements]]
name = "KernelValidateEndpoint"
layer = "Kernel"
category = "Interface"
description = "API endpoint for validating model payloads against kernel contracts."

[[elements]]
name = "KernelProfileEndpoint"
layer = "Kernel"
category = "Interface"
description = "API endpoint for kernel profile CRUD and version management."

# ── Rules: Pattern — Implementation ────────────────────────

[[rules]]
source = "@Composite"
target = "@ActiveStructure"
relation = "contains"
priority = 60
notes = "Kernel boundary contains kernel services."

[[rules]]
source = "@Composite"
target = "@Interface"
relation = "contains"
priority = 60
notes = "Kernel boundary contains kernel ports."

[[rules]]
source = "@Composite"
target = "@PassiveStructure"
relation = "contains"
priority = 60
notes = "Kernel boundary contains kernel artifacts."

[[rules]]
source = "@Composite"
target = "@Behavior"
relation = "contains"
priority = 60
notes = "Kernel boundary contains review steps."

[[rules]]
source = "@Composite"
target = "@Executable"
relation = "contains"
priority = 60
notes = "Kernel boundary contains publication actions."

[[rules]]
source = "@Goal"
target = "@Behavior"
relation = "constrains"
priority = 60
notes = "Kernel goals constrain review behavior."

[[rules]]
source = "@Goal"
target = "@Executable"
relation = "constrains"
priority = 60
notes = "Kernel goals constrain publication actions."

[[rules]]
source = "@ActiveStructure"
target = "@Interface"
relation = "registers"
priority = 60
notes = "Kernel services register kernel interfaces."

# ── Rules: Pattern — Experience Discovery ──────────────────

[[rules]]
source = "@Composite"
target = "@Composite"
relation = "contains"
priority = 60
notes = "Experience nesting and layer-to-experience containment."

[[rules]]
source = "@Composite"
target = "@Page"
relation = "contains"
priority = 60
notes = "Experiences contain user-facing pages."

[[rules]]
source = "@Composite"
target = "@Context"
relation = "contains"
priority = 60
notes = "Layer boundary contains context definitions."

[[rules]]
source = "@Context"
