# EA System Layer: Needs
# Role: 요구 모델 정의

[profile]
name = "EASystemLayerModel"
version = "0.4.1"
kernel_version = "2.5.0"
id_prefix = "eas"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"
Context = "state"
Page = "structure"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership between components and ports."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration linkage."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency on data or policies."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Behavior produces artifacts."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Behavior consumes artifacts."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence transition."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy or guard constrains execution."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience or element."

[[elements]]
name = "NeedsLayer"
layer = "Needs"
category = "Composite"
description = "Needs modeling boundary and runtime chain middle stage."

[[elements]]
name = "NeedsCatalogService"
layer = "Needs"
category = "ActiveStructure"
description = "Maintains normalized needs and prioritization payloads."

[[elements]]
name = "InfraModelPort"
layer = "Infra"
category = "Interface"
description = "6x6 contract port for infra-layer model interface."

[[elements]]
name = "GovernanceModelPort"
layer = "Governance"
category = "Interface"
description = "6x6 contract port for governance-layer model interface."

[[elements]]
name = "DecisionModelPort"
layer = "Decision"
category = "Interface"
description = "6x6 contract port for decision-layer model interface."

[[elements]]
name = "NeedsModelPort"
layer = "Needs"
category = "Interface"
description = "6x6 contract port for needs-layer model interface."

[[elements]]
name = "KernelModelPort"
layer = "Kernel"
category = "Interface"
description = "6x6 contract port for kernel-layer model interface."

[[elements]]
name = "FlowModelPort"
layer = "Flow"
category = "Interface"
description = "6x6 contract port for flow-layer model interface."

[[elements]]
name = "UseCaseCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Collected use-case definitions."

[[elements]]
name = "ActorContextCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Actor profile and environment context records."

[[elements]]
name = "ConstraintCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Functional and non-functional requirement constraints."

[[elements]]
name = "PrioritizedNeedSet"
layer = "Needs"
category = "PassiveStructure"
description = "Prioritized need set consumed by downstream flow."

[[elements]]
name = "NeedVersionGoal"
layer = "Needs"
category = "Goal"
description = "Goal for versioned and traceable needs publication."

[[elements]]
name = "NeedRefinementStep"
layer = "Needs"
category = "Behavior"
description = "Refines raw needs into consistent normalized records."

[[elements]]
name = "PublishNeedSetAction"
layer = "Needs"
category = "Executable"
description = "Publishes prioritized needs for kernel-stage handoff."

[[elements]]
name = "NeedsFeedbackEvent"
layer = "Needs"
category = "Event"
description = "Feedback event for refining needs definitions."

[[rules]]
source = "@Composite"
target = "@ActiveStructure"
relation = "contains"
priority = 60
notes = "Needs boundary contains needs services."

[[rules]]
source = "@Composite"
target = "@PassiveStructure"
relation = "contains"
priority = 60
notes = "Needs boundary contains requirement datasets."

[[rules]]
source = "@Composite"
target = "@Behavior"
relation = "contains"
priority = 60
notes = "Needs boundary contains refinement steps."

[[rules]]
source = "@Composite"
target = "@Executable"
relation = "contains"
priority = 60
notes = "Needs boundary contains publication actions."

[[rules]]
source = "@Goal"
target = "@Behavior"
relation = "constrains"
priority = 60
notes = "Needs goals constrain refinement behavior."

[[rules]]
source = "NeedsCatalogService"
target = "NeedRefinementStep"
relation = "coordinates"
priority = 70
notes = "Catalog service coordinates refinement step execution."

[[rules]]
source = "NeedRefinementStep"
target = "PublishNeedSetAction"
relation = "next"
priority = 70
notes = "Refinement proceeds to needs publication."

[[rules]]
source = "NeedsFeedbackEvent"
target = "NeedRefinementStep"
relation = "triggers"
priority = 70
notes = "Feedback event triggers refinement rerun."

[[rules]]
source = "NeedRefinementStep"
target = "UseCaseCatalog"
relation = "consumes"
priority = 70
notes = "Refinement consumes use-case definitions."

[[rules]]
source = "NeedRefinementStep"
target = "ActorContextCatalog"
relation = "consumes"
priority = 70
notes = "Refinement consumes actor context information."

[[rules]]
source = "NeedRefinementStep"
target = "ConstraintCatalog"
relation = "consumes"
priority = 70
notes = "Refinement consumes constraint definitions."

[[rules]]
source = "NeedRefinementStep"
target = "PrioritizedNeedSet"
relation = "produces"
priority = 70
notes = "Refinement produces prioritized needs."

[[rules]]
source = "PublishNeedSetAction"
target = "PrioritizedNeedSet"
relation = "consumes"
priority = 70
notes = "Publication action consumes prioritized needs."

[[rules]]
source = "PublishNeedSetAction"
target = "PrioritizedNeedSet"
relation = "produces"
priority = 70
notes = "Publication action produces versioned prioritized needs."

[[rules]]
source = "NeedVersionGoal"
target = "PublishNeedSetAction"
relation = "constrains"
priority = 70
notes = "Needs version goal constrains publication behavior."

[[rules]]
source = "PublishNeedSetAction"
target = "KernelModelPort"
relation = "coordinates"
priority = 70
notes = "Runtime chain handoff: needs publication routes to kernel model port."

# ══════════════════════════════════════════════════════════════
# 6x6 Cross-Layer: Needs 관점에서 본 다른 5개 레이어
# ══════════════════════════════════════════════════════════════

# ── Needs → Infra: 요구 카탈로그 영속화 인터페이스 ─────────────

[[elements]]
name = "NeedsStorageContract"
layer = "Infra"
category = "Interface"
description = "Needs view of Infra: storage port contract for persisting needs catalog."

[[elements]]
name = "NeedsContextDataSource"
layer = "Infra"
category = "PassiveStructure"
description = "Needs view of Infra: data source for actor/environment context ingestion."

[[elements]]
name = "NeedsBacklogStore"
layer = "Infra"
category = "PassiveStructure"
description = "Needs view of Infra: persistent backlog storage for prioritization state."

# ── Needs → Governance: 요구 모델 거버넌스 참여 ────────────────

[[elements]]
name = "NeedsApprovalGate"
layer = "Governance"
category = "Behavior"
description = "Needs view of Governance: governance approval gate for needs registration changes."

[[elements]]
name = "NeedsChangePolicy"
layer = "Governance"
category = "Governance"
description = "Needs view of Governance: governance policy for needs change control."

[[elements]]
name = "NeedsAuditPort"
layer = "Governance"
category = "Interface"
description = "Needs view of Governance: audit submission port for governance compliance."

[[elements]]
name = "NeedsVersionRecord"
layer = "Governance"
category = "PassiveStructure"
description = "Needs view of Governance: version metadata for needs catalog evolution."

# ── Needs → Decision: 의사결정 결과의 요구 해석 ────────────────

[[elements]]
name = "DecisionOutcomeInput"
layer = "Decision"
category = "PassiveStructure"
description = "Needs view of Decision: decision outcomes consumed as needs prioritization input."

[[elements]]
name = "DecisionContextReference"
layer = "Decision"
category = "PassiveStructure"
description = "Needs view of Decision: decision context references for needs traceability."

[[elements]]
name = "DecisionTriggerPort"
layer = "Decision"
category = "Interface"
description = "Needs view of Decision: port for triggering decision instances from needs changes."

# ── Needs → Kernel: 커널 도메인의 요구 매핑 ────────────────────

[[elements]]
name = "KernelDomainReference"
layer = "Kernel"
category = "PassiveStructure"
description = "Needs view of Kernel: kernel domain element references for mapping needs to domain."

[[elements]]
name = "KernelConstraintInput"
layer = "Kernel"
category = "PassiveStructure"
description = "Needs view of Kernel: kernel constraints that validate needs feasibility."

[[elements]]
name = "KernelValidationPort"
layer = "Kernel"
category = "Interface"
description = "Needs view of Kernel: validation port for checking needs against kernel rules."

[[elements]]
name = "KernelCoverageTarget"
layer = "Kernel"
category = "PassiveStructure"
description = "Needs view of Kernel: kernel coverage targets that needs must satisfy."

# ── Needs → Flow: 실행 흐름의 요구 충족 추적 ──────────────────

[[elements]]
name = "FlowFulfillmentStatus"
layer = "Flow"
category = "PassiveStructure"
description = "Needs view of Flow: flow execution status for tracking needs fulfillment."

[[elements]]
name = "FlowProgressFeedback"
layer = "Flow"
category = "PassiveStructure"
description = "Needs view of Flow: progress feedback from flow execution for backlog updates."

[[elements]]
name = "FlowCompletionEvent"
layer = "Flow"
category = "Event"
description = "Needs view of Flow: event raised when flow completes a needs-linked execution."

# ══════════════════════════════════════════════════════════════
# 6x6 Cross-Layer Rules: Needs ↔ Infra
# ══════════════════════════════════════════════════════════════

[[rules]]
