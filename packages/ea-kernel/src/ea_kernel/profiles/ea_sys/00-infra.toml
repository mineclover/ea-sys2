# EA System Layer: Infra
# Role: row 데이터 설계

[profile]
name = "EASystemLayerModel"
version = "0.4.1"
kernel_version = "2.5.0"
id_prefix = "eas"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"
Context = "state"
Page = "structure"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership between components and ports."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration linkage."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency on data or policies."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Behavior produces artifacts."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Behavior consumes artifacts."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence transition."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy or guard constrains execution."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience or element."

[[elements]]
name = "InfraLayer"
layer = "Infra"
category = "Composite"
description = "Infrastructure row-data design boundary."

[[elements]]
name = "DataPlatformService"
layer = "Infra"
category = "ActiveStructure"
description = "Primary service that controls row-data contracts and physical data access."

[[elements]]
name = "StorageLifecycleService"
layer = "Infra"
category = "ActiveStructure"
description = "Handles schema lifecycle, migration, and retention routines."

[[elements]]
name = "ProfileStoragePort"
layer = "Infra"
category = "Interface"
description = "Row-data storage port used by governance for profile/model persistence."

[[elements]]
name = "EventStoragePort"
layer = "Infra"
category = "Interface"
description = "Row-data append port for immutable event/audit writes."

[[elements]]
name = "InfraModelPort"
layer = "Infra"
category = "Interface"
description = "6x6 contract port for infra-layer model interface."

[[elements]]
name = "GovernanceModelPort"
layer = "Governance"
category = "Interface"
description = "6x6 contract port for governance-layer model interface."

[[elements]]
name = "DecisionModelPort"
layer = "Decision"
category = "Interface"
description = "6x6 contract port for decision-layer model interface."

[[elements]]
name = "NeedsModelPort"
layer = "Needs"
category = "Interface"
description = "6x6 contract port for needs-layer model interface."

[[elements]]
name = "KernelModelPort"
layer = "Kernel"
category = "Interface"
description = "6x6 contract port for kernel-layer model interface."

[[elements]]
name = "FlowModelPort"
layer = "Flow"
category = "Interface"
description = "6x6 contract port for flow-layer model interface."

[[elements]]
name = "LayerVersionStore"
layer = "Infra"
category = "PassiveStructure"
description = "Row-oriented version table for layer model payloads."

[[elements]]
name = "ValidationRunStore"
layer = "Infra"
category = "PassiveStructure"
description = "Row-oriented validation run table with diagnostics payloads."

[[elements]]
name = "EvidenceStore"
layer = "Infra"
category = "PassiveStructure"
description = "Row-oriented evidence/audit table for execution feedback."

[[elements]]
name = "StoragePolicy"
layer = "Infra"
category = "Governance"
description = "Row lifecycle, retention, and partition policy constraints."

[[rules]]
source = "@Composite"
target = "@ActiveStructure"
relation = "contains"
priority = 60
notes = "Infra boundary contains infrastructure services."

[[rules]]
source = "@Composite"
target = "@Interface"
relation = "contains"
priority = 60
notes = "Infra boundary contains infra-facing ports."

[[rules]]
source = "@Composite"
target = "@PassiveStructure"
relation = "contains"
priority = 60
notes = "Infra boundary contains persistent stores."

[[rules]]
source = "@Governance"
target = "@ActiveStructure"
relation = "constrains"
priority = 60
notes = "Storage policy constrains infra services."

[[rules]]
source = "@ActiveStructure"
target = "@Interface"
relation = "registers"
priority = 60
notes = "Infra services register storage adapter ports."

[[rules]]
source = "DataPlatformService"
target = "StorageLifecycleService"
relation = "coordinates"
priority = 70
notes = "Primary data platform coordinates row schema lifecycle operations."

[[rules]]
source = "DataPlatformService"
target = "LayerVersionStore"
relation = "depends_on"
priority = 70
notes = "Platform service depends on version-row storage."

[[rules]]
source = "DataPlatformService"
target = "ValidationRunStore"
relation = "depends_on"
priority = 70
notes = "Platform service depends on validation-row storage."

[[rules]]
source = "DataPlatformService"
target = "EvidenceStore"
relation = "depends_on"
priority = 70
notes = "Platform service depends on evidence-row storage."

[[rules]]
source = "StorageLifecycleService"
target = "LayerVersionStore"
relation = "produces"
priority = 70
notes = "Lifecycle operations produce updated version rows."

[[rules]]
source = "StorageLifecycleService"
target = "ValidationRunStore"
relation = "produces"
priority = 70
notes = "Lifecycle operations persist validation run rows."

[[rules]]
source = "StorageLifecycleService"
target = "EvidenceStore"
relation = "produces"
priority = 70
notes = "Lifecycle operations produce retention/audit evidence rows."

[[rules]]
source = "StoragePolicy"
target = "DataPlatformService"
relation = "constrains"
priority = 70
notes = "Policy constrains persistence behavior and access boundaries."

[[rules]]
source = "StoragePolicy"
target = "StorageLifecycleService"
relation = "constrains"
priority = 70
notes = "Policy constrains migration and retention lifecycle routines."

# ══════════════════════════════════════════════════════════════
# 6x6 Cross-Layer: Infra 관점에서 본 다른 5개 레이어
# ══════════════════════════════════════════════════════════════

# ── Infra → Governance: 거버넌스 데이터 저장소 설계 ────────────

[[elements]]
name = "GovernanceStorageSchema"
layer = "Governance"
category = "PassiveStructure"
description = "Infra view of Governance: row schema design for governance model/version/agreement records."

[[elements]]
name = "GovernanceAuditStore"
layer = "Governance"
category = "PassiveStructure"
description = "Infra view of Governance: audit trail storage for governance decisions and approvals."

[[elements]]
name = "GovernanceRetentionPolicy"
layer = "Governance"
category = "Governance"
description = "Infra view of Governance: retention/archival policy for governance data."

[[elements]]
name = "GovernanceDataMigration"
layer = "Governance"
category = "Behavior"
description = "Infra view of Governance: schema migration steps for governance data evolution."

# ── Infra → Decision: 의사결정 데이터 저장소 설계 ──────────────

[[elements]]
name = "DecisionDataSchema"
layer = "Decision"
category = "PassiveStructure"
description = "Infra view of Decision: row schema for decision context/option/evaluation/outcome records."

[[elements]]
name = "DecisionIndexStrategy"
layer = "Decision"
category = "PassiveStructure"
description = "Infra view of Decision: indexing strategy for decision trace queries."

[[elements]]
name = "DecisionArchivePolicy"
layer = "Decision"
category = "Governance"
description = "Infra view of Decision: retention policy for decision history data."

# ── Infra → Needs: 요구 데이터 저장소 설계 ─────────────────────

[[elements]]
name = "NeedsDataSchema"
layer = "Needs"
category = "PassiveStructure"
description = "Infra view of Needs: row schema for use-case/actor/constraint/prioritized-need records."

[[elements]]
name = "NeedsContextStore"
layer = "Needs"
category = "PassiveStructure"
description = "Infra view of Needs: context snapshot storage for needs traceability."

[[elements]]
name = "NeedsBacklogIndex"
layer = "Needs"
category = "PassiveStructure"
description = "Infra view of Needs: indexing for backlog priority queries."

# ── Infra → Kernel: 커널 데이터 저장소 설계 ────────────────────

[[elements]]
name = "KernelSpecSchema"
layer = "Kernel"
category = "PassiveStructure"
description = "Infra view of Kernel: row schema for kernel spec/rule/profile storage."

[[elements]]
name = "KernelGraphStore"
layer = "Kernel"
category = "PassiveStructure"
description = "Infra view of Kernel: graph data storage for kernel topology."

[[elements]]
name = "KernelValidationLogStore"
layer = "Kernel"
category = "PassiveStructure"
description = "Infra view of Kernel: validation run log storage."

[[elements]]
name = "KernelStorageMigration"
layer = "Kernel"
category = "Behavior"
description = "Infra view of Kernel: schema migration for kernel data evolution."

# ── Infra → Flow: 플로우 데이터 저장소 설계 ────────────────────

[[elements]]
name = "FlowExecutionLogSchema"
layer = "Flow"
category = "PassiveStructure"
description = "Infra view of Flow: row schema for flow execution/step/outcome logs."

[[elements]]
name = "FlowCheckpointStore"
layer = "Flow"
category = "PassiveStructure"
description = "Infra view of Flow: state checkpoint storage for flow resumption."

[[elements]]
name = "FlowEventLogStore"
layer = "Flow"
category = "PassiveStructure"
description = "Infra view of Flow: event log storage for flow triggers and transitions."

[[elements]]
name = "FlowDataRetentionPolicy"
layer = "Flow"
category = "Governance"
description = "Infra view of Flow: retention policy for flow execution data."

# ══════════════════════════════════════════════════════════════
# 6x6 Cross-Layer Rules: Infra ↔ Governance
# ══════════════════════════════════════════════════════════════

[[rules]]
source = "GovernanceModelPort"
target = "GovernanceStorageSchema"
relation = "contains"
priority = 65
notes = "Infra-Gov: governance model port exposes storage schema."

[[rules]]
