[elements.KernelTypeMapping]
display_name = "커널 타입 매핑"
description = "결정 보기 - 결정 노드 유형에서 커널 엔터티 유형으로 매핑합니다."

[elements.KernelFeedbackInput]
display_name = "커널 피드백 입력"
