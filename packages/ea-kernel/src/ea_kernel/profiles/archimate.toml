[[rules]]
id = "am-agg-04"
source = "@Composite"
target = "@PassiveStructure"
relation = "Aggregation"
priority = 40
notes = "Composite aggregates passive structure"

# ── Assignment (association): active structure → behavior ─────────

[[rules]]
id = "am-assign-01"
source = "@ActiveStructure"
target = "@Behavior"
relation = "Assignment"
priority = 40
notes = "Active structure is assigned to behavior"

[[rules]]
id = "am-assign-02"
source = "@ActiveStructure"
target = "@ActiveStructure"
relation = "Assignment"
priority = 50
notes = "Active structure assigned to active structure (node→software)"

