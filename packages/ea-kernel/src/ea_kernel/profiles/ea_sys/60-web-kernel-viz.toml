# EA System Layer: Web Kernel Viz (Frontend)
# Role: 커널/프로파일/거버넌스 시각화 및 탐색 프론트엔드

[profile]
name = "EASystemLayerModel"
version = "1.0.0"
kernel_version = "2.5.0"
id_prefix = "wkv"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Goal = "state"
Context = "state"
Page = "structure"
Layout = "structure"

# ── Relations ──────────────────────────────────────────────

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Boundary containment."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Data consumption."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Data production."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Navigation or step sequence."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Goal or policy constraint."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience."

[[relations]]
name = "renders"
kernel_relation = "association"
description = "Layout component renders a page or view."

# ── Elements: Application Boundary ───────────────────────

[[elements]]
name = "WebKernelVizApp"
layer = "Kernel"
category = "Composite"
description = "Top-level application boundary for web-kernel-viz frontend."

# ── Elements: Context (사용자 역할) ──────────────────────

[[elements]]
name = "ExplorerContext"
layer = "Kernel"
category = "Context"
description = "User context for exploring kernel schema, profile topology, and rules."

[[elements]]
name = "GovernanceOperatorContext"
layer = "Governance"
category = "Context"
description = "User context for monitoring rule lifecycle, models, and decisions."

[[elements]]
name = "ModelDesignerContext"
layer = "Kernel"
category = "Context"
description = "User context for designing and authoring profiles (future editor tab)."

# ── Elements: Goal (목표) ────────────────────────────────

[[elements]]
name = "ModelUnderstandingGoal"
layer = "Kernel"
category = "Goal"
description = "G1: Understand model structure visually through topology and traversal."

[[elements]]
name = "RuleDiscoveryGoal"
layer = "Kernel"
category = "Goal"
description = "G2: Explore rules by group, inspect details, and execute triple judgments."

[[elements]]
name = "GovernanceMonitoringGoal"
layer = "Governance"
category = "Goal"
description = "G4: Monitor rule lifecycle states, model versions, and decision history."

[[elements]]
name = "ChangeSimulationGoal"
layer = "Governance"
category = "Goal"
description = "G5: Simulate impact of rule promotions before applying changes."

# ── Elements: Experience (경험 경계) ─────────────────────

[[elements]]
name = "ExplorerExperience"
layer = "Kernel"
category = "Composite"
description = "Experience boundary for model exploration journey (G1+G2)."

[[elements]]
name = "GovernanceExperience"
layer = "Governance"
category = "Composite"
description = "Experience boundary for governance monitoring journey (G4+G5)."

# ── Elements: Layout (공통 레이아웃) ─────────────────────

[[elements]]
name = "AppShell"
layer = "Kernel"
category = "Layout"
description = "Root layout shell: top nav + side panel + canvas + detail slide-over."

[[elements]]
name = "TopNavComponent"
layer = "Kernel"
category = "Layout"
description = "Primary navigation bar with section/sub-view selection."

[[elements]]
name = "SidePanelComponent"
layer = "Kernel"
category = "Layout"
description = "Collapsible left panel for contextual filters and controls."

[[elements]]
name = "DetailSlideOverComponent"
layer = "Kernel"
category = "Layout"
description = "Right slide-over panel for inspecting node/rule/judgment details."

# ── Elements: Page (Explorer) ────────────────────────────

[[elements]]
name = "KernelSchemaPage"
layer = "Kernel"
category = "Page"
description = "Kernel entity/relation graph visualization (FlowGraph)."

[[elements]]
name = "ProfileGraphPage"
layer = "Kernel"
category = "Page"
description = "Profile topology graph with reachable traversal highlighting."

[[elements]]
name = "RulesPage"
layer = "Kernel"
category = "Page"
description = "Rule group browser, rule table, and triple judge interface."

# ── Elements: Page (Governance) ──────────────────────────

[[elements]]
name = "RuleLifecyclePage"
layer = "Governance"
category = "Page"
description = "Rule lifecycle state board with state filter and approve action."

[[elements]]
name = "ModelsPage"
layer = "Governance"
category = "Page"
description = "Model state lookup and version inspection."

[[elements]]
name = "DecisionsPage"
layer = "Governance"
category = "Page"
description = "Decision trace lookup and evidence inspection."

[[elements]]
name = "SimulationPage"
layer = "Governance"
category = "Page"
description = "What-if simulation for rule promotion impact analysis."

# ── Elements: API Endpoint (consumed by pages) ──────────

[[elements]]
name = "KernelSchemaEndpoint"
layer = "Kernel"
category = "Interface"
description = "API: /kernel/entities, /kernel/relations — kernel schema data."

[[elements]]
name = "KernelRulesEndpoint"
layer = "Kernel"
category = "Interface"
description = "API: /kernel/rules, /kernel/rules/{id} — rule exploration."

[[elements]]
name = "KernelJudgeEndpoint"
layer = "Kernel"
category = "Interface"
description = "API: /kernel/judge — evidence-based triple judgment."

[[elements]]
name = "ProfileListEndpoint"
layer = "Kernel"
category = "Interface"
description = "API: /profiles — registered profile listing."

[[elements]]
name = "ProfileTopologyEndpoint"
layer = "Kernel"
category = "Interface"
description = "API: /profiles/{name}/topology — full graph nodes+edges."

[[elements]]
name = "ProfileTraversalEndpoint"
layer = "Kernel"
category = "Interface"
description = "API: /profiles/{name}/reachable, /paths, /impact — graph traversal."

[[elements]]
name = "GovernanceRulesEndpoint"
layer = "Governance"
category = "Interface"
description = "API: /rules — governance rule lifecycle CRUD."

[[elements]]
name = "GovernanceModelsEndpoint"
layer = "Governance"
category = "Interface"
description = "API: /models/{name} — model state lookup."

[[elements]]
name = "GovernanceDecisionsEndpoint"
layer = "Governance"
category = "Interface"
description = "API: /models/decisions/{id} — decision trace."

[[elements]]
name = "GovernanceSimulationEndpoint"
layer = "Governance"
category = "Interface"
description = "API: /simulation/what-if — promotion simulation."

# ── Elements: Data Artifact ──────────────────────────────

[[elements]]
name = "TopologyData"
layer = "Kernel"
category = "PassiveStructure"
description = "Graph data (nodes + edges) consumed by visualization components."

[[elements]]
name = "TraversalResult"
layer = "Kernel"
category = "PassiveStructure"
description = "Reachable set / paths result from graph traversal API."

[[elements]]
name = "JudgmentResult"
layer = "Kernel"
category = "PassiveStructure"
description = "Verdict + evidence from triple judgment execution."

[[elements]]
name = "SimulationResult"
layer = "Governance"
category = "PassiveStructure"
description = "What-if simulation output: impact, risk, verdict changes."

# ── Elements: Behavior / Action ──────────────────────────

[[elements]]
name = "TraversalInteraction"
layer = "Kernel"
category = "Behavior"
description = "Node click → fetchReachable → highlight reachable set."

[[elements]]
name = "JudgeInteraction"
layer = "Kernel"
category = "Behavior"
description = "Enter triple → execute judge → show verdict in detail panel."

[[elements]]
name = "SimulateAction"
layer = "Governance"
category = "Executable"
description = "Submit rule + confidence → run what-if → display results."

