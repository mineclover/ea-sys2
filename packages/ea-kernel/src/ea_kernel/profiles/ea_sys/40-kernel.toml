# ── Elements: Governance Lifecycle (S1-S6) ─────────────────
# 6-Phase governance system implemented in ea-kernel:
# S1 Authoring, S2 Judgment, S3 Recording, S4 Analysis, S5 Evolution, S6 Propagation

[[elements]]
name = "GovernanceSystem"
layer = "Kernel"
category = "ActiveStructure"
description = "Unified governance facade combining S1-S6 lifecycle components for rule authoring, judgment, recording, analysis, evolution, and propagation."

[[elements]]
name = "JudgmentService"
layer = "Kernel"
category = "ActiveStructure"
description = "S2 Judgment: governance-aware judgment service wrapping RuleCorpus.judge() with reference statistics and auto-recording."

[[elements]]
name = "EvidenceAnalyzer"
layer = "Kernel"
category = "ActiveStructure"
description = "S4 Analysis: analyzes accumulated decision records to extract rule effectiveness, conflict hotspots, and usage profiles."

[[elements]]
name = "PromotionEngine"
layer = "Kernel"
category = "ActiveStructure"
description = "S5 Evolution: identifies promotion and deprecation candidates from analysis reports and manages rule change proposals."

[[elements]]
name = "WhatIfSimulator"
layer = "Kernel"
category = "ActiveStructure"
description = "S5 Evolution: simulates impact of rule changes (add/remove/modify/priority) against past decision history before applying."

[[elements]]
name = "ImpactEvaluator"
layer = "Kernel"
category = "ActiveStructure"
description = "S6 Propagation: evaluates impact of rule change sets on existing decisions with severity assessment and recommendations."

[[elements]]
name = "LifecycleController"
layer = "Kernel"
category = "ActiveStructure"
description = "Governance automation controller subscribing to lifecycle events (RULE_SUBMITTED, RULE_APPROVED, CORPUS_UPDATED) and coordinating S1-S6 handlers."

[[elements]]
name = "KernelModelRegistrationService"
layer = "Kernel"
category = "ActiveStructure"
description = "Persistent model registration, validation, and activation service with atomic register-validate transactions."

[[elements]]
name = "KernelService"
layer = "Kernel"
category = "ActiveStructure"
description = "Service layer providing UC1-UC6 pure query functions for kernel entities, relations, rules, judgment, topology, and profiles."

[[elements]]
name = "RuleCorpus"
layer = "Kernel"
category = "ActiveStructure"
description = "Metadata-enriched rule collection with evidence-based judgment, domain-aware conflict detection, and query capabilities."

[[elements]]
name = "ProfileRuleCompiler"
layer = "Kernel"
category = "ActiveStructure"
description = "Compiles profile rule patterns (@Category/#Layer) into concrete kernel entity rules with compilation statistics."

[[elements]]
name = "ProfileTopologyGraph"
layer = "Kernel"
category = "ActiveStructure"
description = "Navigable topology graph expanding profile validity rules into concrete element-to-element edges for reachability and path analysis."

# ── Elements: Governance Stores (ABC + InMemory + SQLite) ──

[[elements]]
name = "RuleAssetStore"
layer = "Kernel"
category = "ActiveStructure"
description = "S1 Authoring: rule asset lifecycle persistence (DRAFT -> REVIEW -> APPROVED -> DEPRECATED) with ABC, InMemory, and SQLite implementations."

[[elements]]
name = "DecisionStore"
layer = "Kernel"
category = "ActiveStructure"
description = "S3 Recording: judgment record persistence with query, statistics, and evidence summary. ABC, InMemory, and SQLite implementations."

[[elements]]
name = "CorpusVersionStore"
layer = "Kernel"
category = "ActiveStructure"
description = "S3 Recording: versioned corpus snapshots enabling judgment reproduction and change tracking. ABC, InMemory, and SQLite implementations."

[[elements]]
name = "I18nStore"
layer = "Kernel"
category = "ActiveStructure"
description = "Translation CRUD store for kernel schema i18n with versioning and audit. ABC, InMemory, and SQLite implementations."

# ── Elements: Governance Event Infrastructure ──────────────

[[elements]]
name = "LifecycleEventPort"
layer = "Kernel"
category = "Interface"
description = "Event port ABC for lifecycle event publish/subscribe (RULE_SUBMITTED, RULE_APPROVED, CORPUS_UPDATED)."

[[elements]]
name = "InMemoryEventBus"
layer = "Kernel"
category = "ActiveStructure"
description = "In-memory lifecycle event bus implementing LifecycleEventPort with synchronous handler dispatch and event history."

[[elements]]
name = "NotificationService"
layer = "Kernel"
category = "Interface"
description = "Abstract notification interface for sending governance notifications (info/success/warning/error/urgent levels)."

# ── Elements: Governance Data Artifacts ────────────────────

[[elements]]
name = "EnhancedJudgment"
layer = "Kernel"
category = "PassiveStructure"
description = "S2 result: JudgmentReport enriched with ReferenceStats (past judgment consistency) and optional stored decision record."

[[elements]]
name = "ReferenceStats"
layer = "Kernel"
category = "PassiveStructure"
description = "S2 artifact: past judgment statistics for a triple including consistency rate, allow/deny counts, and consensus verdict."

[[elements]]
name = "AnalysisReport"
layer = "Kernel"
category = "PassiveStructure"
description = "S4 artifact: comprehensive evidence analysis combining rule effectiveness, conflict hotspots, usage profiles, and recommendations."

[[elements]]
name = "RuleEffectiveness"
layer = "Kernel"
category = "PassiveStructure"
description = "S4 artifact: per-rule effectiveness measurement (evaluations, matches, wins, overrides, shadows) with effectiveness grade."

[[elements]]
name = "ConflictHotspot"
layer = "Kernel"
category = "PassiveStructure"
description = "S4 artifact: detected repeated conflict triple with domain pair tracking and severity classification."

[[elements]]
name = "UsageProfile"
layer = "Kernel"
category = "PassiveStructure"
description = "S4 artifact: per-domain usage statistics with reference grade (GOLD/SILVER/BRONZE/DRAFT) based on quality metrics."

[[elements]]
name = "RuleChangeProposal"
layer = "Kernel"
category = "PassiveStructure"
description = "S5 artifact: rule change proposal with voting, approval workflow, and evidence report reference."

[[elements]]
name = "PromotionCriteria"
layer = "Kernel"
category = "Assessment"
description = "S5 expression: promotion threshold criteria (min evaluations, win rate, max override rate, min age) for rule advancement."

[[elements]]
name = "SimulationResult"
layer = "Kernel"
category = "PassiveStructure"
description = "S5 artifact: what-if simulation result with verdict changes, impact level, affected domains, and safety assessment."

[[elements]]
name = "ImpactReport"
layer = "Kernel"
category = "PassiveStructure"
description = "S6 artifact: impact evaluation report with affected decisions, severity, risk factors, and apply recommendation."

[[elements]]
name = "RuleChangeSet"
layer = "Kernel"
category = "PassiveStructure"
description = "S6 artifact: corpus version diff expressing added, removed, modified, and state-changed rules between two versions."

[[elements]]
name = "ModelRegistryEntry"
layer = "Kernel"
category = "PassiveStructure"
description = "Model registration record with model_id, status, active version reference, and timestamps."

[[elements]]
name = "ModelVersionEntry"
layer = "Kernel"
category = "PassiveStructure"
description = "Model version record with content hash, parent version linkage, and creation metadata."

[[elements]]
name = "ValidationRunEntry"
layer = "Kernel"
category = "PassiveStructure"
description = "Model validation run record with pass/fail result, errors, and validator context."

[[elements]]
name = "RegistrationResult"
layer = "Kernel"
category = "PassiveStructure"
description = "Atomic model registration result combining model_id, version_id, and validation_run_id."

[[elements]]
name = "Notification"
layer = "Kernel"
category = "PassiveStructure"
description = "Governance notification data with recipient, subject, message, and severity level."

[[elements]]
name = "LifecycleEvent"
layer = "Kernel"
category = "Event"
description = "Lifecycle event carrying trigger type (RULE_SUBMITTED/RULE_APPROVED/CORPUS_UPDATED), payload, and source actor."

# ── Elements: Governance Lifecycle Events ──────────────────

[[elements]]
name = "RuleSubmittedEvent"
layer = "Kernel"
category = "Event"
description = "Raised when a new rule asset is submitted for review (DRAFT -> REVIEW transition trigger)."

[[elements]]
name = "RuleApprovedEvent"
layer = "Kernel"
category = "Event"
description = "Raised when a rule is approved (REVIEW -> APPROVED), triggering corpus rebuild and version snapshot."

[[elements]]
name = "CorpusUpdatedEvent"
layer = "Kernel"
category = "Event"
description = "Raised when the active rule corpus version changes, triggering impact analysis and i18n audit."

# ── Elements: Governance Goals ─────────────────────────────

[[elements]]
name = "RuleLifecycleIntegrityGoal"
layer = "Kernel"
category = "Goal"
description = "Goal ensuring rule lifecycle transitions follow valid state machine (DRAFT -> REVIEW -> APPROVED -> DEPRECATED)."

[[elements]]
name = "EvidenceBasedEvolutionGoal"
layer = "Kernel"
category = "Goal"
description = "Goal ensuring rule evolution decisions are driven by evidence analysis rather than arbitrary changes."

# ── Elements: Governance Steps ─────────────────────────────

[[elements]]
name = "ExecuteJudgmentStep"
layer = "Kernel"
category = "Behavior"
description = "S2 step: execute governance-aware judgment with reference stats lookup and auto-record to decision store."

[[elements]]
name = "AnalyzeEvidenceStep"
layer = "Kernel"
category = "Behavior"
description = "S4 step: generate comprehensive analysis report from accumulated decision records."

[[elements]]
name = "SimulateChangeStep"
layer = "Kernel"
category = "Behavior"
description = "S5 step: simulate rule changes against past decisions to assess impact before applying."

[[elements]]
name = "EvaluateImpactStep"
layer = "Kernel"
category = "Behavior"
description = "S6 step: evaluate rule change set impact on existing decisions with severity and recommendation."

[[elements]]
name = "RunAutoPromotionStep"
layer = "Kernel"
category = "Behavior"
description = "S5 step: automated promotion loop analyzing evidence, identifying candidates, simulating, and proposing changes."

# ── Elements: Governance Actions ───────────────────────────

[[elements]]
name = "SubmitRuleAction"
layer = "Kernel"
category = "Executable"
description = "S1 action: submit a new rule asset (DRAFT) and publish RULE_SUBMITTED event."

[[elements]]
name = "ApproveRuleAction"
layer = "Kernel"
category = "Executable"
description = "S1/S5 action: approve a rule, rebuild active corpus, and publish RULE_APPROVED event."

[[elements]]
name = "DeprecateRuleAction"
layer = "Kernel"
category = "Executable"
description = "S1 action: deprecate an approved rule and rebuild corpus without the deprecated rule."

[[elements]]
name = "CreateSnapshotAction"
layer = "Kernel"
category = "Executable"
description = "Version management action: create a persistent snapshot of the current active corpus."

# ── Elements: Governance Experience ────────────────────────

[[elements]]
name = "GovernanceOperatorContext"
layer = "Kernel"
category = "Context"
description = "User context for operating the kernel governance lifecycle (rule submission, approval, analysis)."

[[elements]]
name = "KernelGovernanceExperience"
layer = "Kernel"
category = "Composite"
description = "Experience boundary for kernel governance lifecycle operations (S1-S6 journey)."

[[elements]]
name = "KernelGovernanceDashboardPage"
layer = "Kernel"
category = "Page"
description = "Dashboard view for governance health, rule lifecycle status, and analysis reports."

[[elements]]
name = "KernelGovernanceEndpoint"
layer = "Kernel"
category = "Interface"
description = "API endpoint for governance operations (submit, approve, analyze, simulate, evaluate impact)."

