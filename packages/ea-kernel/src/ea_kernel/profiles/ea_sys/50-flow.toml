[[rules]]
source = "StepSpecContract"
target = "SchemaSpecContract"
relation = "depends_on"
priority = 60
notes = "StepSpec input/output_schema delegates to SchemaSpec."

[[rules]]
source = "KernelGroundedStepSpecType"
target = "StepSpecContract"
relation = "registers"
priority = 60
notes = "KernelGroundedStepSpec implements StepSpec contract."

[[rules]]
source = "KernelGroundedStepSpecType"
target = "FlowMetaStepDefinition"
relation = "depends_on"
priority = 60
notes = "KernelGroundedStepSpec requires FlowMetaStep at construction."

[[rules]]
source = "UseCaseSpecType"
target = "WorkflowSpecContract"
relation = "registers"
priority = 60
notes = "UseCaseSpec implements WorkflowSpec contract."

[[rules]]
source = "UseCaseSpecType"
target = "StepSpecContract"
relation = "depends_on"
priority = 60
notes = "UseCaseSpec holds a list of StepSpec instances."

[[rules]]
source = "WorkflowSpecContract"
target = "StepSpecContract"
relation = "depends_on"
priority = 60
notes = "WorkflowSpec.get_steps() returns list of StepSpec."

[[rules]]
source = "WorkflowSpecContract"
target = "SchemaSpecContract"
relation = "depends_on"
priority = 60
notes = "WorkflowSpec declares global input/output SchemaSpec."

[[rules]]
source = "FlowTopologyData"
target = "StepSpecContract"
relation = "depends_on"
priority = 60
notes = "FlowTopology contains list of StepSpec instances."

[[rules]]
source = "FlowTopologyData"
target = "FlowGenerationRuleData"
relation = "depends_on"
priority = 60
notes = "FlowTopology includes generation_rules for meta-modeling."

[[rules]]
source = "FlowGenerationRuleData"
target = "FlowMetaStepDefinition"
relation = "depends_on"
priority = 60
notes = "FlowGenerationRule references FlowMetaStep names in required_steps."

[[rules]]
source = "StepResultSpecData"
target = "SchemaSpecContract"
