# TOGAF 10 Kernel Profile
#
# 54 elements, 18 relations, 56 explicit rules (46 allow + 10 deny)
# 10 categories → 10 kernel types (datatype unused)
#
# Pattern conventions:
#   @Category  — matches elements by category (e.g., @Behavior)
#   #Layer     — matches elements by layer (e.g., #Business)
#   ElementName — exact element match

[profile]
name = "TOGAF"
version = "10"
kernel_version = "2.5.0"
id_prefix = "tg"
standard = "TOGAF 10"
organization = "The Open Group"

[categories]
ActiveStructure = "structure"
Behavior = "step"
PassiveStructure = "item"
Event = "event"
Interface = "port"
Composite = "package"
Executable = "action"
Goal = "state"
Assessment = "expression"
Governance = "feature"

# ═══════════════════════════════════════════════════════════════════
