# ── Pattern: App Boundary Containment ────────────────────

[[rules]]
source = "WebKernelVizApp"
target = "@Composite"
relation = "contains"
priority = 60
notes = "App boundary contains experiences."

[[rules]]
source = "WebKernelVizApp"
target = "@Layout"
relation = "contains"
priority = 60
notes = "App boundary contains layout components."

[[rules]]
source = "WebKernelVizApp"
target = "@Context"
relation = "contains"
priority = 60
notes = "App boundary contains user contexts."

[[rules]]
source = "WebKernelVizApp"
target = "@Goal"
relation = "contains"
priority = 60
notes = "App boundary contains goals."

# ── Pattern: Experience Containment ──────────────────────

[[rules]]
source = "@Composite"
target = "@Page"
relation = "contains"
priority = 60
notes = "Experiences contain pages."

[[rules]]
source = "@Composite"
target = "@Interface"
relation = "contains"
priority = 60
notes = "Experiences contain endpoints."

[[rules]]
source = "@Composite"
target = "@Behavior"
relation = "contains"
priority = 60
notes = "Experiences contain interactive behaviors."

[[rules]]
source = "@Composite"
target = "@Executable"
relation = "contains"
priority = 60
notes = "Experiences contain executable actions."

[[rules]]
source = "@Composite"
target = "@PassiveStructure"
