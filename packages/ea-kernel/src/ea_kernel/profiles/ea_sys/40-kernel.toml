priority = 70
notes = "Review proceeds to publication action."

[[rules]]
source = "PublishKernelContractAction"
target = "KernelCapabilityModel"
relation = "produces"
priority = 70
notes = "Publication updates kernel capability model."

[[rules]]
source = "PublishKernelContractAction"
target = "KernelSpecSnapshot"
relation = "produces"
priority = 70
notes = "Publication writes versioned spec snapshot."

[[rules]]
source = "KernelSpecPublishedEvent"
