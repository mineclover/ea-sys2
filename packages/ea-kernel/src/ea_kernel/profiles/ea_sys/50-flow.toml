[[rules]]
source = "SpecificationPlane"
target = "KernelGroundedStepSpecType"
relation = "contains"
priority = 60
notes = "P1 plane owns kernel-grounded step specs."

[[rules]]
source = "SpecificationPlane"
target = "WorkflowSpecContract"
relation = "contains"
priority = 60
notes = "P1 plane owns WorkflowSpec ABC contract."

[[rules]]
source = "SpecificationPlane"
target = "UseCaseSpecType"
relation = "contains"
priority = 60
