# Zachman Framework 6.0 Kernel Profile
#
# 36 elements (6 interrogatives x 6 perspectives), 12 relations, 31 rules (31 allow + 0 deny)
# 6 categories -> 6 kernel types

[profile]
name = "Zachman"
version = "6.0"
kernel_version = "2.5.0"
id_prefix = "zf"
standard = "Zachman Framework 6.0"
organization = "Zachman International"

[categories]
What = "item"
How = "step"
Where = "package"
Who = "structure"
When = "event"
Why = "state"

