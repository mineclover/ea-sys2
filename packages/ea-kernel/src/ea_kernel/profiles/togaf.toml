# ── decomposition (ownership): structural breakdown ───────────────

[[rules]]
id = "tg-decomp-01"
source = "@ActiveStructure"
target = "@ActiveStructure"
relation = "decomposition"
priority = 40
notes = "Active structure decomposes into active structure"

[[rules]]
id = "tg-decomp-02"
