[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-flow"
version = "0.1.0"
description = "Detail Layer for EA System - Execution Flows & Automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["workflow", "automation", "execution", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "ea-kernel>=2.5.0",
    "ea-decision>=0.1.0",
    "ea-needs>=0.1.0",
    "ea-profile>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ea_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_flow"
