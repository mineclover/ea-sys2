description = "S4 아티팩트: 도메인 쌍 추적 및 심각도 분류를 통해 반복되는 충돌 삼중을 감지했습니다."

[elements.UsageProfile]
display_name = "사용 프로필"
description = "S4 아티팩트: 품질 지표를 기반으로 한 참조 등급(GOLD/SILVER/BRONZE/DRAFT)이 포함된 도메인별 사용 통계입니다."

[elements.RuleChangeProposal]
display_name = "규칙 변경 제안"
description = "S5 아티팩트: 투표, 승인 워크플로 및 증거 보고서 참조가 포함된 규칙 변경 제안."

[elements.PromotionCriteria]
display_name = "승격기준"
description = "S5 표현: 규칙 발전을 위한 승격 임계값 기준(최소 평가, 승률, 최대 재정의 비율, 최소 기간)."

[elements.SimulationResult]
display_name = "시뮬레이션 결과"
description = "S5 아티팩트: 판정 변경, 영향 수준, 영향을 받는 도메인 및 안전성 평가가 포함된 가상 시뮬레이션 결과입니다."

[elements.ImpactReport]
display_name = "영향 보고서"
description = "S6 아티팩트: 영향을 받은 결정, 심각도, 위험 요소 및 권장 사항 적용이 포함된 영향 평가 보고서입니다."

[elements.RuleChangeSet]
display_name = "규칙 변경 세트"
description = "S6 아티팩트: 두 버전 간의 추가, 제거, 수정 및 상태 변경 규칙을 표현하는 코퍼스 버전 차이입니다."

[elements.ModelRegistryEntry]
display_name = "모델 레지스트리 항목"
description = "model_id, 상태, 활성 버전 참조 및 타임스탬프가 포함된 모델 등록 기록입니다."

[elements.ModelVersionEntry]
display_name = "모델 버전 항목"
description = "콘텐츠 해시, 상위 버전 연결, 생성 메타데이터가 포함된 모델 버전 기록입니다."

[elements.ValidationRunEntry]
display_name = "검증 실행 항목"
description = "합격/실패 결과, 오류, 유효성 검사기 컨텍스트가 포함된 모델 유효성 검사 실행 기록입니다."

[elements.RegistrationResult]
display_name = "등록결과"
description = "model_id, version_id, 유효성 검사_run_id를 결합한 원자 모델 등록 결과입니다."

[elements.Notification]
display_name = "공고"
description = "수신자, 제목, 메시지 및 심각도 수준이 포함된 거버넌스 알림 데이터입니다."

[elements.LifecycleEvent]
display_name = "수명주기 이벤트"
description = "트리거 유형(RULE_SUBMITTED/RULE_APPROVED/CORPUS_UPDATED), 페이로드 및 소스 행위자를 전달하는 수명주기 이벤트입니다."

[elements.RuleSubmittedEvent]
display_name = "규칙 제출 이벤트"
description = "검토를 위해 새 규칙 자산이 제출되면 발생합니다(초안 -> 검토 전환 트리거)."

[elements.RuleApprovedEvent]
display_name = "규칙 승인 이벤트"
description = "규칙이 승인되면(REVIEW -> APPROVED) 발생하며 코퍼스 재구축 및 버전 스냅샷이 트리거됩니다."

[elements.CorpusUpdatedEvent]
display_name = "코퍼스 업데이트 이벤트"
description = "활성 규칙 코퍼스 버전이 변경되면 발생하여 영향 분석 및 i18n 감사가 트리거됩니다."

[elements.RuleLifecycleIntegrityGoal]
display_name = "규칙 수명주기 무결성 목표"
description = "규칙 수명주기 전환을 보장하는 목표는 유효한 상태 시스템(초안 -> 검토 -> 승인됨 -> 사용 중지됨)을 따릅니다."

[elements.EvidenceBasedEvolutionGoal]
display_name = "증거 기반 진화 목표"
description = "규칙 발전 결정을 보장하는 목표는 임의적인 변경보다는 증거 분석에 의해 주도됩니다."

[elements.ExecuteJudgmentStep]
display_name = "판단 단계 실행"
description = "S2 단계: 참조 통계 조회 및 의사결정 저장소에 대한 자동 기록을 통해 거버넌스 인식 판단을 실행합니다."

[elements.AnalyzeEvidenceStep]
display_name = "증거 분석 단계"
description = "S4 단계: 누적된 의사결정 기록으로부터 종합 분석 보고서를 생성합니다."

[elements.SimulateChangeStep]
display_name = "변경 단계 시뮬레이션"
description = "S5 단계: 과거 결정에 대한 규칙 변경 사항을 시뮬레이션하여 적용하기 전에 영향을 평가합니다."

[elements.EvaluateImpactStep]
display_name = "영향 단계 평가"
description = "S6 단계: 심각도 및 권장 사항을 통해 규칙 변경 세트가 기존 결정에 미치는 영향을 평가합니다."

[elements.RunAutoPromotionStep]
display_name = "자동 승격 단계 실행"
description = "S5 단계: 증거를 분석하고, 후보를 식별하고, 시뮬레이션하고, 변경 사항을 제안하는 자동화된 프로모션 루프입니다."

[elements.SubmitRuleAction]
display_name = "규칙 작업 제출"
description = "S1 작업: 새 규칙 자산(DRAFT)을 제출하고 RULE_SUBMITTED 이벤트를 게시합니다."

[elements.ApproveRuleAction]
display_name = "규칙 작업 승인"
description = "S1/S5 작업: 규칙 승인, 활성 코퍼스 재구축, RULE_APPROVED 이벤트 게시."

[elements.DeprecateRuleAction]
display_name = "더 이상 사용되지 않는 규칙 작업"
description = "S1 작업: 승인된 규칙을 더 이상 사용하지 않고 더 이상 사용되지 않는 규칙 없이 말뭉치를 다시 빌드합니다."

[elements.CreateSnapshotAction]
display_name = "스냅샷 작업 생성"
description = "버전 관리 작업: 현재 활성 자료의 영구 스냅샷을 만듭니다."

[elements.GovernanceOperatorContext]
display_name = "거버넌스 운영자 컨텍스트"
description = "커널 거버넌스 수명주기(규칙 제출, 승인, 분석)를 운영하기 위한 사용자 컨텍스트입니다."

[elements.KernelGovernanceExperience]
display_name = "커널 거버넌스 경험"
description = "커널 거버넌스 수명주기 작업(S1-S6 여정)에 대한 경계를 경험해 보세요."

[elements.KernelGovernanceDashboardPage]
display_name = "커널 거버넌스 대시보드 페이지"
description = "거버넌스 상태, 규칙 수명주기 상태 및 분석 보고서에 대한 대시보드 보기입니다."

[elements.KernelGovernanceEndpoint]
display_name = "커널 거버넌스 엔드포인트"
description = "거버넌스 작업을 위한 API 엔드포인트(제출, 승인, 분석, 시뮬레이션, 영향 평가)"

