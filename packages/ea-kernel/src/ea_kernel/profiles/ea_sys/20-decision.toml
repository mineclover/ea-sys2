# EA System Layer: Decision
# Role: 의사결정 메타-메타 모델 정의

[profile]
name = "EASystemLayerModel"
version = "0.4.1"
kernel_version = "2.5.0"
id_prefix = "eas"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"
Context = "state"
Page = "structure"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership between components and ports."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration linkage."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency on data or policies."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Behavior produces artifacts."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Behavior consumes artifacts."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence transition."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy or guard constrains execution."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience or element."

# ============================================================
# Internal Decision Layer Elements
# ============================================================

[[elements]]
name = "DecisionLayer"
layer = "Decision"
category = "Composite"
description = "Decision meta-meta modeling boundary and runtime entry chain start."

[[elements]]
name = "DecisionMetaModelRegistry"
layer = "Decision"
category = "ActiveStructure"
description = "Registers decision-flow meta entities and relation vocabularies."

[[elements]]
name = "DecisionFlowSchemaService"
layer = "Decision"
category = "ActiveStructure"
description = "Maintains structural schemas for decision activities and transitions."

[[elements]]
name = "DecisionAgreementService"
layer = "Decision"
category = "ActiveStructure"
description = "Maintains agreement semantics for decision outcome closure."

# --- Topic Aggregate Root (ea_decision.topic) ---

[[elements]]
name = "TopicAggregate"
layer = "Decision"
category = "Composite"
description = "Aggregate root container for Design Thinking process — groups research, questions, options, report, and report history within a single decision problem."

# --- Services from implementation ---

[[elements]]
name = "DesignThinkingProcessService"
layer = "Decision"
category = "ActiveStructure"
description = "Orchestrator for the Design Thinking lifecycle phases: define_intent → diverge → converge → utilize."

[[elements]]
name = "DecisionPatternRegistryService"
layer = "Decision"
category = "ActiveStructure"
description = "Manages registration and lookup of DecisionPattern definitions (ea_decision.registry)."

[[elements]]
name = "DecisionRepositoryService"
layer = "Decision"
category = "ActiveStructure"
description = "File-based JSON persistence for Topic aggregates — save, retrieve, and list topics (ea_decision.repository)."

[[elements]]
name = "KernelBridgeService"
layer = "Decision"
category = "ActiveStructure"
description = "Bridges decision outputs to kernel modeling actions via lazy ea_kernel import — create_rule_provenance and decision_result_from_rule_asset (ea_decision.kernel_bridge)."

# --- 6x6 Model Ports ---

[[elements]]
name = "InfraModelPort"
layer = "Infra"
category = "Interface"
description = "6x6 contract port for infra-layer model interface."

[[elements]]
name = "GovernanceModelPort"
layer = "Governance"
category = "Interface"
description = "6x6 contract port for governance-layer model interface."

[[elements]]
name = "DecisionModelPort"
layer = "Decision"
category = "Interface"
description = "6x6 contract port for decision-layer model interface."

[[elements]]
name = "NeedsModelPort"
layer = "Needs"
category = "Interface"
description = "6x6 contract port for needs-layer model interface."

[[elements]]
name = "KernelModelPort"
layer = "Kernel"
category = "Interface"
description = "6x6 contract port for kernel-layer model interface."

[[elements]]
name = "FlowModelPort"
layer = "Flow"
category = "Interface"
description = "6x6 contract port for flow-layer model interface."

# --- Assessment Models ---

[[elements]]
name = "DecisionCriteriaModel"
layer = "Decision"
category = "Assessment"
description = "Meta definition for criteria schema used in option evaluation — maps to EvaluationCriteria and EvaluationDimension."

[[elements]]
name = "DecisionHeuristicModel"
layer = "Decision"
category = "Assessment"
description = "Meta definition for heuristic schema used in deliberation — maps to HeuristicRule in PatternSchema."

[[elements]]
name = "DecisionRationaleModel"
layer = "Decision"
category = "Assessment"
description = "Meta definition for rationale schema and explainability constraints — maps to Rationale frozen type."

# --- Catalogs (PassiveStructure) ---

[[elements]]
name = "DecisionNodeTypeCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of decision node types (context, option, evaluation, outcome)."

[[elements]]
name = "DecisionRelationTypeCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of relation types among decision nodes."

[[elements]]
name = "DecisionStateCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of states used in decision lifecycle modeling — DecisionStatus (PROPOSED/ACCEPTED/REJECTED/DEPRECATED)."

[[elements]]
name = "DecisionPhaseCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of DecisionPhase values — DIVERGE, CONVERGE, UTILIZE — representing Design Thinking workflow stages."

[[elements]]
name = "DecisionComplexityCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of DecisionComplexity levels — TRIVIAL, STRUCTURAL, STRATEGIC — used by DecisionPattern."

[[elements]]
name = "DecisionLifecycleStateCatalog"
layer = "Decision"
category = "PassiveStructure"
description = "Catalog of DecisionLifecycleState values — DRAFT → PROPOSED → ACCEPTED/REJECTED → DEPRECATED/SUPERSEDED — frozen state machine with transition validation."

# --- Instance Records (PassiveStructure) ---

[[elements]]
name = "DecisionContextRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured decision context instance record."

[[elements]]
name = "DecisionOptionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured option graph instance record."

[[elements]]
name = "DecisionEvaluationRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured evaluation instance record."

[[elements]]
name = "DecisionOutcomeRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured final decision outcome record."

[[elements]]
name = "IntentRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Frozen Intent value object — id, description, direction, context_refs — the 'why' starting point of the Diverge phase."

[[elements]]
name = "ChoiceOptionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Frozen ChoiceOption value object — intent_id, description, feasibility_score, alignment_score — generated during Diverge phase."

[[elements]]
name = "ChoiceRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Frozen Choice value object — selected_option_id, rationale, distance — output of Converge phase."

[[elements]]
name = "DecisionResultRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Frozen DecisionResult value object — intent_id, choice_id, outcome_artifact, timestamp — output of Utilize phase."

[[elements]]
name = "ResearchNoteRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Mutable ResearchNote — markdown content, source_url, references, author — raw data gathered during Diverge phase."

[[elements]]
name = "QuestionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Mutable Question with reply() — text, asked_by, answer, answered_by — inquiries made during the decision process."

[[elements]]
name = "OptionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Candidate solution path — title, description, evaluation (pros/cons/score) — generated within Topic."

[[elements]]
name = "EvaluationDetailRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Pros/cons analysis of an option — pros list, cons list, score (0-10), comment."

[[elements]]
name = "ModelingActionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Planned kernel model change — action_type (create_rule/define_entity), target, description, status, payload — the 'how' execution plan in DesignReport."

[[elements]]
name = "DesignDecisionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Finalized decision — selected_option_id, rationale, pattern_name, complexity, impact_analysis, status, approver — with approve() lifecycle method."

[[elements]]
name = "DesignReportRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Formal Design Thinking output — title, summary, decision, modeling_actions, key_evidence_refs — the 'plan' aggregating decision and execution steps."

[[elements]]
name = "DecisionPatternRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Frozen DecisionPattern definition — name, description, complexity, governed_rule_group, required_intent_tags, inquiry_template, verification_heuristics, outcome_anchors."

[[elements]]
name = "PatternSchemaRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Meta-model for decision patterns — name, PatternType (TRADE_OFF/COMPLIANCE/ARCHITECTURE/PROCESS), phases, heuristics, inquiry_template."

[[elements]]
name = "EvidenceRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Frozen structured evidence — id, EvidenceType (DOCUMENT/DATA/EXPERT_OPINION/BENCHMARK/REGULATION), uri, title, relevance_score."

[[elements]]
name = "EvidenceCollectionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Immutable collection of Evidence items — add() returns a new collection (functional append)."

[[elements]]
name = "EvaluationDimensionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Single evaluation axis — name, description, weight, scale — used by EvaluationResult for weighted scoring."

[[elements]]
name = "RuleProvenanceRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Kernel bridge output — decision_ref, report_ref — linking a decision to a kernel RuleAsset for traceability."

# --- Goals ---

[[elements]]
name = "DecisionTraceGoal"
layer = "Decision"
category = "Goal"
description = "Goal for traceable and reproducible decision-flow instances."

[[elements]]
name = "EvidenceBasedDecisionGoal"
layer = "Decision"
category = "Goal"
description = "Core principle — all decisions must be grounded in evidence; every Decision is justified by Evidence and immutable after finalization."

# --- Behaviors (Steps) ---

[[elements]]
name = "CaptureDecisionContextStep"
layer = "Decision"
category = "Behavior"
description = "Step that materializes decision context nodes."

[[elements]]
name = "BuildOptionGraphStep"
layer = "Decision"
category = "Behavior"
description = "Step that materializes option node graph."

[[elements]]
name = "EvaluateOptionGraphStep"
layer = "Decision"
category = "Behavior"
description = "Step that evaluates option graph into comparable records."

[[elements]]
name = "FinalizeDecisionStep"
layer = "Decision"
category = "Behavior"
description = "Step that closes evaluation into an outcome record."

[[elements]]
name = "DivergeStep"
layer = "Decision"
category = "Behavior"
description = "Topic Diverge phase — add_research, ask questions, add_option — generating options based on Intent."

[[elements]]
name = "ConvergeStep"
layer = "Decision"
category = "Behavior"
description = "Topic Converge phase — finalize_plan selects option, creates DesignDecision and DesignReport."

[[elements]]
name = "UtilizeStep"
layer = "Decision"
category = "Behavior"
description = "Topic Utilize phase — apply DesignReport modeling actions to produce DecisionResult and kernel artifacts."

[[elements]]
name = "ApplyPatternStep"
layer = "Decision"
category = "Behavior"
description = "Applies a DecisionPattern to a Topic — auto-populates inquiry_template questions and verification_heuristics research notes."

[[elements]]
name = "ReviseReportStep"
layer = "Decision"
category = "Behavior"
description = "Re-opens a completed Topic for further discussion — archives current report to report_history and resets status to active."

# --- Executables (Actions) ---

[[elements]]
name = "PublishDecisionModelAction"
layer = "Decision"
category = "Executable"
description = "Action that publishes decision-flow model instances for needs-stage handoff."

[[elements]]
name = "MapDecisionToKernelAction"
layer = "Decision"
category = "Executable"
description = "Kernel bridge action — create_rule_provenance and decision_result_from_rule_asset — translates decision outputs into kernel-compatible structures."

[[elements]]
name = "PersistTopicAction"
layer = "Decision"
category = "Executable"
description = "Repository action — save_topic, get_topic, list_topics — JSON file-based persistence for Topic aggregates."

# --- Events ---

[[elements]]
name = "DecisionRequestedEvent"
layer = "Decision"
category = "Event"
description = "Raised when a new decision-flow instance is requested."

[[elements]]
name = "DecisionUpdatedEvent"
layer = "Decision"
category = "Event"
description = "Raised when upstream context changes require reevaluation."

[[elements]]
name = "DecisionFinalizedEvent"
layer = "Decision"
category = "Event"
description = "Raised when Topic.finalize_plan completes — DesignReport and DesignDecision are produced."

[[elements]]
name = "DecisionRevisedEvent"
layer = "Decision"
category = "Event"
description = "Raised when Topic.revise_report re-opens a completed topic — current report archived to history."

[[elements]]
name = "PatternAppliedEvent"
layer = "Decision"
category = "Event"
description = "Raised when a DecisionPattern is applied to a Topic — inquiry questions and verification heuristics populated."

