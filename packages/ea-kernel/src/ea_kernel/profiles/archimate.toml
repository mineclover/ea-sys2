relation = "Triggering"
priority = 40
notes = "Behavior triggers event"

[[rules]]
id = "am-trig-04"
source = "@Event"
target = "@Event"
relation = "Triggering"
priority = 40
notes = "Event triggers event"

# ── Flow (flow): data/material transfer ───────────────────────────

[[rules]]
id = "am-flow-01"
source = "@Behavior"
target = "@Behavior"
relation = "Flow"
priority = 40
notes = "Flow between behaviors"

[[rules]]
id = "am-flow-02"
source = "@Event"
target = "@Behavior"
relation = "Flow"
priority = 40
notes = "Flow from event to behavior"

[[rules]]
id = "am-flow-03"
source = "@Behavior"
target = "@Event"
relation = "Flow"
priority = 40
notes = "Flow from behavior to event"

# ── Specialization (specialization): same category ────────────────

[[rules]]
id = "am-spec-01"
source = "*"
target = "*"
relation = "Specialization"
priority = 40
conditions = ["SAME_CATEGORY"]
notes = "Specialization within same category only"

# ── Association: general ──────────────────────────────────────────

[[rules]]
id = "am-assoc-01"
source = "*"
target = "*"
relation = "Association"
priority = 40
notes = "General association between any elements"

# ── Deny rules ────────────────────────────────────────────────────

[[rules]]
id = "am-deny-01"
source = "@PassiveStructure"
target = "@ActiveStructure"
relation = "Composition"
valid = false
priority = 80
notes = "Passive structure cannot compose active structure"

[[rules]]
id = "am-deny-02"
source = "@Behavior"
target = "@ActiveStructure"
relation = "Composition"
valid = false
priority = 80
notes = "Behavior cannot compose active structure"

[[rules]]
id = "am-deny-03"
source = "@PassiveStructure"
target = "@Behavior"
relation = "Assignment"
valid = false
priority = 80
notes = "Passive structure cannot be assigned to behavior"

[[rules]]
id = "am-deny-04"
source = "@Event"
target = "@PassiveStructure"
relation = "Triggering"
valid = false
priority = 80
notes = "Event cannot trigger passive structure"

[[rules]]
id = "am-deny-05"
source = "@PassiveStructure"
target = "@Behavior"
relation = "Triggering"
valid = false
priority = 80
notes = "Passive structure cannot trigger behavior"

[[rules]]
id = "am-deny-06"
source = "@ActiveStructure"
target = "@PassiveStructure"
relation = "Triggering"
valid = false
priority = 80
notes = "Active structure cannot trigger passive structure"

[[rules]]
id = "am-deny-09"
source = "@PassiveStructure"
target = "@ActiveStructure"
relation = "Access"
valid = false
priority = 80
notes = "Passive structure cannot access active structure"

[[rules]]
id = "am-deny-10"
source = "@Junction"
target = "@Junction"
relation = "Specialization"
valid = false
priority = 80
notes = "Junction cannot specialize junction"
