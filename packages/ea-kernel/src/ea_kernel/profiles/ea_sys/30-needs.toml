# ══════════════════════════════════════════════════════════════
# N2 Catalog — Process Stages (Behavior)
# ══════════════════════════════════════════════════════════════

[[elements]]
name = "IdentifyStage"
layer = "Needs"
category = "Behavior"
description = "Process stage: identify — initial recognition and capture of a need."

[[elements]]
name = "QueryStage"
layer = "Needs"
category = "Behavior"
description = "Process stage: query — interrogation and elaboration of an identified need."

[[elements]]
name = "ModelDetailStage"
layer = "Needs"
category = "Behavior"
description = "Process stage: model_detail — detailed modeling and structuring of a need."

# ══════════════════════════════════════════════════════════════
# N2.5 Schema — NeedsSchema Definition
# ══════════════════════════════════════════════════════════════

[[elements]]
name = "NeedsSchema"
layer = "Needs"
category = "PassiveStructure"
description = "Schema definition for the needs layer (SchemaPort-compatible). Contains NeedsEntity and NeedsRelation tuples. Singleton: NEEDS_SCHEMA."

# ══════════════════════════════════════════════════════════════
# N2.5 Service — needs_service.py Query Functions
# ══════════════════════════════════════════════════════════════

[[elements]]
name = "NeedsQueryService"
layer = "Needs"
category = "ActiveStructure"
description = "Pure-function query service (needs_service.py). Provides list_stakeholders, list_use_cases, list_needs, describe_need, need_lineage, catalog_summary."

# ══════════════════════════════════════════════════════════════
# N3 Integration — Kernel Bridge, Profile Bridge, Repository
# ══════════════════════════════════════════════════════════════

[[elements]]
name = "KernelBridgePort"
layer = "Needs"
category = "Interface"
description = "Lazy kernel integration bridge (kernel_bridge.py). Validates kernel_refs against KernelSchema and retrieves kernel entity metadata. Only module importing ea_kernel."

[[elements]]
name = "ProfileBridgePort"
layer = "Needs"
category = "Interface"
description = "Profile loading bridge (profile_bridge.py). Loads needs-layer profiles from TOML with optional NEEDS_SCHEMA validation and needs condition registry."

[[elements]]
name = "NeedRepository"
layer = "Needs"
category = "ActiveStructure"
description = "File-based JSON repository for NeedCatalog persistence (repository.py). Methods: save_catalog, get_catalog, list_catalogs."

[[elements]]
name = "ConditionRegistry"
layer = "Needs"
category = "PassiveStructure"
description = "Needs-specific condition vocabulary extending kernel defaults. Adds SAME_STATUS, SAME_PRIORITY, SAME_USE_CASE, SAME_STAKEHOLDER conditions."

# ══════════════════════════════════════════════════════════════
# N2 Catalog Events
# ══════════════════════════════════════════════════════════════

[[elements]]
name = "NeedExpressedEvent"
layer = "Needs"
category = "Event"
description = "Event raised when a stakeholder formally expresses a new need."

[[elements]]
name = "NeedRevisedEvent"
layer = "Needs"
category = "Event"
description = "Event raised when an existing need is revised to create a new lineage version."

[[elements]]
name = "NeedStatusTransitionEvent"
layer = "Needs"
category = "Event"
description = "Event raised when a need transitions between lifecycle states (DRAFT->EXPRESSED->ACKNOWLEDGED->ADDRESSED/WITHDRAWN)."

[[elements]]
name = "DecisionEvidenceInheritedEvent"
layer = "Needs"
category = "Event"
description = "Event raised when decision evidence references are inherited into a need."

