[[elements]]
name = "DecisionCriteriaModel"
layer = "Decision"
category = "Assessment"
description = "Meta definition for criteria schema used in option evaluation."

[[elements]]
name = "DecisionHeuristicModel"
layer = "Decision"
category = "Assessment"
