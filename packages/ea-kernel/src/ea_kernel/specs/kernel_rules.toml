# Kernel Metamodel Validity Rules — v2.5.0
#
# Defines what relationships are permitted between kernel entities.
# Priority bands:
#   1       = deny-by-default fallback (one per relation)
#   40-50   = broad metatype-level allows
#   60      = general structural patterns
#   70      = specific behavioral patterns
#   80-90   = explicit prohibitions (override allows)

[meta]
kernel_version = "2.5.0"
total_explicit_rules = 67
total_explicit_metadata = 67
total_layer_constraints = 2

fallback_relations = [
    "membership", "ownership", "specialization", "feature_typing",
    "association", "connector", "redefinition", "subsetting",
    "flow", "succession", "interaction", "triggering", "guarding",
    "transition",
]

# ═══════════════════════════════════════════════════════════════════
# Layer Constraints
# ═══════════════════════════════════════════════════════════════════

[[layer_constraints]]
id = "lc-00-l4-l4-association"
source_layer = "L4"
target_layer = "L4"
forbidden = ["association"]
allowed_pairs = [["step*", "state"], ["state", "step*"]]
priority = 90
notes = "L4 entities cannot form L2 association (except step*↔state for realization/motivation)"

[[layer_constraints]]
id = "lc-01-l4-l4-connector"
source_layer = "L4"
target_layer = "L4"
forbidden = ["connector"]
allowed_pairs = []
priority = 90
notes = "L4 behavioral entities cannot use connector (use succession instead)"

# ═══════════════════════════════════════════════════════════════════
# Membership rules
# ═══════════════════════════════════════════════════════════════════

[rules.mem-01]
source = "namespace*"
target = "element*"
relation = "membership"
valid = true
priority = 40
conditions = ["LAYER_ORDER"]
notes = "Namespace contains elements (container layer <= member layer)"
[rules.mem-01.metadata]
domain = "kernel"
tags = ["containment", "namespace"]
category = "structural"
confidence = "universal"
source = "UML 2.5.1 §7.4 Namespaces"
established_version = "1.0.0"
rationale = "Namespaces are the fundamental containment mechanism; layer ordering ensures abstraction coherence"

[rules.mem-02]
source = "package"
target = "package"
relation = "membership"
priority = 60
notes = "Package nesting"
[rules.mem-02.metadata]
domain = "kernel"
tags = ["containment", "package"]
category = "structural"
confidence = "universal"
source = "UML 2.5.1 §7.4 Namespaces"
established_version = "1.0.0"
rationale = "Package nesting is a fundamental namespace containment pattern"

