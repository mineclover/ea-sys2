# EASystem-Infra — Korean (ko) i18n Patch (normalized)

[elements.InfraLayer]
display_name = "인프라 계층"
description = "인프라 로우 데이터 설계 경계를 정의하는 상위 레이어입니다."

[elements.DataPlatformService]
display_name = "데이터 플랫폼 서비스"
description = "로우 데이터 계약과 물리 저장 접근을 관리하는 핵심 서비스입니다."

[elements.StorageLifecycleService]
display_name = "저장소 생명주기 서비스"
description = "스키마 진화, 마이그레이션, 보존 정책 실행을 담당합니다."

[elements.ProfileStoragePort]
display_name = "프로파일 저장 포트"
description = "프로파일/모델 영속화를 위한 저장 인터페이스 포트입니다."

[elements.EventStoragePort]
display_name = "이벤트 저장 포트"
description = "불변 이벤트 및 감사 로그 적재를 위한 append 전용 저장 포트입니다."

[elements.InfraModelPort]
display_name = "인프라 모델 포트"
description = "인프라 레이어의 6x6 모델 계약 포트입니다."

[elements.GovernanceModelPort]
display_name = "거버넌스 모델 포트"
description = "거버넌스 레이어와 연동되는 6x6 모델 계약 포트입니다."

[elements.DecisionModelPort]
display_name = "의사결정 모델 포트"
description = "의사결정 레이어와 연동되는 6x6 모델 계약 포트입니다."

[elements.NeedsModelPort]
display_name = "요구 모델 포트"
description = "요구 레이어와 연동되는 6x6 모델 계약 포트입니다."

[elements.KernelModelPort]
display_name = "커널 모델 포트"
description = "커널 레이어와 연동되는 6x6 모델 계약 포트입니다."

[elements.FlowModelPort]
display_name = "흐름 모델 포트"
description = "흐름 레이어와 연동되는 6x6 모델 계약 포트입니다."

[elements.LayerVersionStore]
display_name = "계층 버전 저장소"
description = "레이어 모델 페이로드 버전을 로우 단위로 저장합니다."

[elements.ValidationRunStore]
display_name = "검증 실행 저장소"
description = "검증 실행 이력과 진단 페이로드를 저장합니다."

[elements.EvidenceStore]
display_name = "증거 저장소"
description = "실행 피드백 및 감사 증거 데이터를 저장합니다."

[elements.StoragePolicy]
display_name = "저장 정책"
description = "보존 기간, 파티셔닝, 수명주기 규칙을 정의합니다."

[elements.GovernanceStorageSchema]
display_name = "거버넌스 저장 스키마"
description = "거버넌스 모델/버전/합의 데이터의 저장 스키마 뷰입니다."

[elements.GovernanceAuditStore]
display_name = "거버넌스 감사 저장소"
description = "거버넌스 승인/결정에 대한 감사 추적 데이터를 저장합니다."

[elements.GovernanceRetentionPolicy]
display_name = "거버넌스 보존 정책"
description = "거버넌스 데이터 보존 및 아카이브 기준을 정의합니다."

[elements.GovernanceDataMigration]
display_name = "거버넌스 데이터 마이그레이션"
description = "거버넌스 데이터 스키마 진화를 위한 마이그레이션 절차입니다."

[elements.DecisionDataSchema]
display_name = "의사결정 데이터 스키마"
description = "의사결정 맥락/옵션/평가/결과 저장을 위한 스키마입니다."

[elements.DecisionIndexStrategy]
display_name = "의사결정 인덱스 전략"
description = "의사결정 추적 조회 성능을 위한 인덱스 전략입니다."

[elements.DecisionArchivePolicy]
display_name = "의사결정 아카이브 정책"
description = "의사결정 이력 데이터의 보존 및 아카이브 정책입니다."

[elements.NeedsDataSchema]
display_name = "요구 데이터 스키마"
description = "유스케이스/액터/제약/우선순위 요구를 저장하는 스키마입니다."

[elements.NeedsContextStore]
display_name = "요구 컨텍스트 저장소"
description = "요구 추적성 확보를 위한 컨텍스트 스냅샷 저장소입니다."

[elements.NeedsBacklogIndex]
display_name = "요구 백로그 인덱스"
description = "백로그 우선순위 조회를 위한 인덱스 구성 요소입니다."

[elements.KernelSpecSchema]
display_name = "커널 스펙 스키마"
description = "커널 스펙/룰/프로파일 저장을 위한 스키마입니다."

[elements.KernelGraphStore]
display_name = "커널 그래프 저장소"
description = "커널 토폴로지 데이터를 저장하는 그래프 스토어입니다."

[elements.KernelValidationLogStore]
display_name = "커널 검증 로그 저장소"
description = "커널 검증 실행 로그를 저장합니다."

[elements.KernelStorageMigration]
display_name = "커널 저장소 마이그레이션"
description = "커널 데이터 스키마 진화를 위한 마이그레이션 절차입니다."

[elements.FlowExecutionLogSchema]
display_name = "흐름 실행 로그 스키마"
description = "흐름 실행/스텝/결과 로그 저장을 위한 스키마입니다."

[elements.FlowCheckpointStore]
display_name = "흐름 체크포인트 저장소"
description = "흐름 재개를 위한 상태 체크포인트를 저장합니다."

[elements.FlowEventLogStore]
display_name = "흐름 이벤트 로그 저장소"
description = "흐름 트리거 및 전이 이벤트를 저장합니다."

[elements.FlowDataRetentionPolicy]
display_name = "흐름 데이터 보존 정책"
description = "흐름 실행 데이터의 보존 및 정리 정책입니다."

[elements.ResourceIndexingService]
display_name = "리소스 인덱싱 서비스"
description = "리소스를 검색하고 인덱싱하는 파일 시스템 스캐너입니다. ea-infra ResourceIndexer 구현: scan()은 URI, 경로, content_type 및 last_modified 메타데이터가 포함된 Resource 객체를 생성합니다."

[elements.ResourceDescriptor]
display_name = "리소스 설명자"
description = "색인화된 리소스 메타데이터 레코드입니다. ea-infra 리소스 데이터 클래스에 해당: uri, path, name, content_type, last_modified, 선택적 콘텐츠."

[elements.SQLiteStorageBackend]
display_name = "SQLite 저장소 백엔드"
description = "모든 도메인 저장소에서 공유되는 SQLite 기반 저장소 백엔드입니다. 연결 관리, WAL 모드, 스키마 버전 관리 및 마이그레이션 지원을 제공합니다. 모든 *Store ABC 뒤에 구체적인 구현이 있습니다."

[elements.SchemaVersionTable]
display_name = "스키마 버전 테이블"
description = "모든 SQLite 데이터베이스에 존재하는 스키마 버전 추적 테이블입니다. 모든 저장소에서 향후 호환 가능한 스키마 마이그레이션을 활성화합니다."

[elements.I18nStorePort]
display_name = "I18n 스토어 포트"
description = "커널 스키마 변환을 위한 스토리지 포트입니다. CRUD + 기록 + TOML 대량 가져오기 + 스키마 감사가 포함된 ABC. 번역 및 번역_역사 테이블을 사용하여 data/i18n.db에서 SQLite 구현."

[elements.RuleAssetStorePort]
display_name = "규칙 자산 저장소 포트"
description = "규칙 자산 수명주기 지속성을 위한 스토리지 포트입니다. 생성/가져오기/쿼리/전환/update_entry/history가 포함된 ABC입니다. rule_assets 및 rule_asset_history 테이블, 상태 및 도메인 인덱스를 사용한 SQLite 구현입니다."

[elements.DecisionStorePort]
display_name = "의사결정 저장소 포트"
description = "판단 기록 지속성을 위한 저장 포트입니다. 저장/가져오기/쿼리/개수/통계가 포함된 ABC입니다. Decision_records 및 구체화된 Judge_statistics 테이블을 사용한 SQLite 구현입니다."

[elements.CorpusVersionStorePort]
display_name = "코퍼스 버전 저장소 포트"
description = "규칙 말뭉치 버전 스냅샷을 위한 스토리지 포트입니다. create_version/get/get_entries/get_latest/query/history/diff가 포함된 ABC. Corpus_versions 및 version_entries 테이블을 사용한 SQLite 구현."

[elements.ProfileVersionStorePort]
display_name = "프로필 버전 저장소 포트"
description = "프로필 버전 지속성을 위한 스토리지 포트입니다. ea-profile StoragePort ABC(store/get/get_latest/list_versions/tag/delete 포함). profile_versions 및 profile_tags 테이블을 사용하여 data/profiles.db에서 SQLite 구현."

[elements.I18nDataStore]
display_name = "I18n 데이터 저장소"
description = "번역 데이터는 data/i18n.db에 저장됩니다. 번역(PK: 종류+이름+언어+필드) 및 Translation_history(버전 감사 추적) 테이블을 보유합니다."

[elements.RuleAssetDataStore]
display_name = "규칙 자산 데이터 저장소"
description = "규칙 자산 데이터 저장소. rule_assets(현재 버전, PK: rule_id), rule_asset_history(버전 추적, rule_id+version에서 고유함) 및 Schema_version 테이블을 보유합니다. 주, 도메인, 작성자, source_type별로 색인이 생성됩니다."

[elements.DecisionDataStore]
display_name = "의사결정 데이터 저장소"
description = "의사결정 기록 데이터 저장소. Triple/actor/judgment_json 열이 포함된 Decision_records(PK: Storage_id)와 판단_통계(구체화, PK: 소스+대상+관계)를 보유합니다. 트리플, 액터, 타임스탬프, Corpus_version으로 인덱싱됩니다."

[elements.CorpusVersionDataStore]
display_name = "코퍼스 버전 데이터 저장소"
description = "코퍼스 버전 스냅샷 데이터 저장소. rule_count 및 rule_ids_json이 있는 corpus_versions(PK: version_id)와 직렬화된 규칙 및 메타데이터 JSON이 있는 version_entries(PK: version_id+rule_id)를 보유합니다."

[elements.ProfileVersionDataStore]
display_name = "프로필 버전 데이터 저장소"
description = "data/profiles.db에 프로필 버전 데이터 저장소가 있습니다. content_hash 및 요소/관계/규칙 개수가 포함된 profile_versions(PK: id, profile_name+version에 고유함) 및 profile_tags(PK: profile_name+name)를 보유합니다."

[elements.TransactionStorePort]
display_name = "거래 저장소 포트"
description = "ACID 트랜잭션 관리 및 이벤트 소싱을 위한 스토리지 포트입니다. ea-governance TransactionManager에 해당: 시작/커밋/롤백/실패 + 이벤트 추가. transaction.db의 SQLite."

[elements.TransactionDataStore]
display_name = "거래 데이터 저장소"
description = "transaction.db에 트랜잭션 데이터 저장소가 있습니다. 상태/페이로드/로그가 포함된 트랜잭션(PK: id)과 이벤트 소싱을 위한 transaction_events(FK: tx_id)를 보유합니다. 상태 및 update_at로 색인화됩니다."

[elements.TransactionEvent]
display_name = "거래 이벤트"
description = "트랜잭션 이벤트 로그에 도메인 이벤트가 추가되었습니다. 트랜잭션당 event_type, 메시지, 페이로드를 캡처합니다. 이벤트 소싱 재생 및 감사를 활성화합니다."

[elements.GovernanceLayerStorePort]
display_name = "거버넌스 레이어 저장소 포트"
description = "레이어 범위 거버넌스 모델 페이로드를 위한 스토리지 포트입니다. save_payload/get_payload/list_snapshots가 포함된 ABC. 인프라, 거버넌스, 의사결정, 요구, 커널, 흐름을 위한 layers/{layer}.db에 6개의 독립적인 SQLite DB가 있습니다."

[elements.GovernanceLayerDataStore]
display_name = "거버넌스 계층 데이터 저장소"
description = "레이어 범위 데이터 저장소는 레이어/{layer}.db에 있습니다. 각 DB에는 payload_json 및 update_at와 함께 layer_models(PK: layer+model_id)가 저장됩니다. layer+updated_at로 색인화됩니다."

[elements.GovernanceKernelSnapshotStore]
display_name = "거버넌스 커널 스냅샷 저장소"
description = "GovernanceLayerStore에 구축된 커널 스냅샷 저장소. 접두사 모델_ID: 규칙:{id}, corpus_version:{id}, 판단:{id}. RuleAsset/CorpusVersionInfo/EnhancedJudgment를 JSON 페이로드로 직렬화합니다."

[elements.GovernanceNeedsSnapshotStore]
display_name = "거버넌스에는 스냅샷 저장소가 필요합니다."
description = "GovernanceLayerStore에 구축된 카탈로그 저장소가 필요합니다. NeedCatalog를 JSON 페이로드로 저장하고 ID별로 카탈로그 나열 및 검색이 가능합니다."

[elements.FileBasedPersistenceService]
display_name = "파일 기반 지속성 서비스"
description = "파일 기반 JSON 지속성 서비스. data_dir/catalogs/에 있는 JSON 파일을 사용하여 ea-needs NeedRepository: save_catalog/get_catalog/list_catalogs를 구현합니다. SQLite에 대한 가벼운 대안."

[elements.JSONFileStore]
display_name = "JSON 파일 저장소"
description = "data_dir/catalogs/{id}.json의 JSON 파일 저장 구조. 각 파일에는 직렬화된 NeedCatalog가 포함되어 있습니다. 가벼운 지속성을 위해 ea-needs 저장소에서 사용됩니다."

[elements.DataDirectoryLayout]
display_name = "데이터 디렉토리 레이아웃"
description = "물리적 스토리지 조직을 관리하는 데이터 디렉터리 레이아웃 규칙: {data_dir}/layers/{layer}.db(6개 거버넌스 DB), kernel/profiles.db(모델 등록), transaction.db(ACID 이벤트 로그), ea_kernel/data/i18n.db 및 프로필.db."

[relations.contains]
display_name = "포함"
description = "상위 구조가 하위 요소를 포함하는 관계입니다."

[relations.registers]
display_name = "등록"
description = "요소를 레지스트리/카탈로그에 등록하는 관계입니다."

[relations.coordinates]
display_name = "조율"
description = "복수 요소의 협업 실행을 조정하는 관계입니다."

[relations.depends_on]
display_name = "의존"
description = "한 요소가 다른 요소에 의존하는 관계입니다."

[relations.produces]
display_name = "생산"
description = "산출물 또는 데이터를 생성하는 관계입니다."

[relations.consumes]
display_name = "소비"
description = "산출물 또는 데이터를 입력으로 소비하는 관계입니다."

[relations.next]
display_name = "다음"
description = "순차 실행에서 다음 단계로 이어지는 관계입니다."

[relations.triggers]
display_name = "트리거"
description = "이벤트/조건이 다음 동작을 촉발하는 관계입니다."

[relations.constrains]
display_name = "제약"
description = "정책/규칙이 대상의 동작을 제한하는 관계입니다."

[relations.available_in]
display_name = "가용"
description = "대상 컨텍스트에서 해당 요소가 사용 가능함을 나타냅니다."

