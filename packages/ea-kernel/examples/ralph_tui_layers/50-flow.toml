[[rules]]
source = "SyncTrackerStep"
target = "SelectTaskStep"
relation = "next"
priority = 70
notes = "Loop order: sync before selection."

[[rules]]
source = "SelectTaskStep"
target = "BuildPromptStep"
relation = "next"
priority = 70
notes = "Loop order: selection before prompt build."

[[rules]]
source = "BuildPromptStep"
target = "ExecuteAgentAction"
relation = "next"
priority = 70
notes = "Loop order: prompt build before execution."

[[rules]]
source = "ExecuteAgentAction"
target = "DetectCompletionStep"
relation = "next"
priority = 70
