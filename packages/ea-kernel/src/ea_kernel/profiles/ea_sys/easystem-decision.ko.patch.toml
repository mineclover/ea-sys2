[elements.FlowResultFeedback]
display_name = "흐름 결과 피드백"
description = "결정 보기 — 결정 모델 수정을 위해 사용된 흐름 실행 결과입니다."

[elements.FlowDecisionHook]
display_name = "흐름 의사결정 훅"
description = "결정 보기 — 실행 중에 결정 평가를 호출하는 흐름용 후크입니다."

[elements.TopicAggregate]
display_name = "주제 집계"
description = "디자인 사고 프로세스를 위한 집계 루트 컨테이너 — 단일 결정 문제 내에서 연구, 질문, 옵션, 보고서 및 보고서 기록을 그룹화합니다."

[elements.DesignThinkingProcessService]
display_name = "디자인씽킹 프로세스 서비스"
description = "디자인 사고 수명주기 단계를 위한 조정자: 정의 의도 → 분기 → 수렴 → 활용."

[elements.DecisionPatternRegistryService]
display_name = "의사결정 패턴 등록 서비스"
description = "DecisionPattern 정의(ea_decision.registry)의 등록 및 조회를 관리합니다."

[elements.DecisionRepositoryService]
display_name = "의사결정 저장소 서비스"
description = "주제 집계를 위한 파일 기반 JSON 지속성 - 주제 저장, 검색 및 나열(ea_decision.repository)."

[elements.KernelBridgeService]
display_name = "커널 브리지 서비스"
description = "지연 ea_kernel 가져오기 — create_rule_provenance 및 Decision_result_from_rule_asset(ea_decision.kernel_bridge)을 통해 결정 출력을 커널 모델링 작업에 연결합니다."

[elements.DecisionPhaseCatalog]
display_name = "결정 단계 카탈로그"
description = "디자인 사고 워크플로우 단계를 나타내는 DecisionPhase 값(DIVERGE, CONVERGE, UTILIZE)의 카탈로그입니다."

[elements.DecisionComplexityCatalog]
display_name = "의사결정 복잡성 카탈로그"
description = "DecisionPattern에서 사용하는 DecisionComplexity 수준(TRIVIAL, STRUCTURAL, STRATEGIC)의 카탈로그입니다."

[elements.DecisionLifecycleStateCatalog]
display_name = "결정 수명주기 상태 카탈로그"
description = "DecisionLifecycleState 값 카탈로그 — 초안 → 제안됨 → 승인/거절 → 사용 중단/대체 — 전환 유효성 검사가 포함된 고정 상태 시스템입니다."

[elements.IntentRecord]
display_name = "의도 기록"
description = "고정 의도 값 개체 — id, 설명, 방향, context_refs — 분기 단계의 '이유' 시작 지점입니다."

[elements.ChoiceOptionRecord]
display_name = "선택 옵션 기록"
description = "고정된 ChoiceOption 값 개체(intent_id, 설명, feasibility_score, alignment_score)는 Diverge 단계에서 생성됩니다."

[elements.ChoiceRecord]
display_name = "초이스 레코드"
description = "고정 선택 값 개체 — selected_option_id, 근거, 거리 — 수렴 단계의 출력입니다."

[elements.DecisionResultRecord]
display_name = "판정 결과 기록"
description = "고정된 DecisionResult 값 개체 —intent_id, choice_id,outcome_artifact,timestamp —Utilize 단계의 출력입니다."

[elements.ResearchNoteRecord]
display_name = "연구노트 기록"
description = "변경 가능한 ResearchNote — 마크다운 콘텐츠, source_url, 참조, 작성자 — Diverge 단계에서 수집된 원시 데이터입니다."

[elements.QuestionRecord]
display_name = "질문 기록"
description = "reply()가 포함된 변경 가능한 질문 — text, Asked_by, Answer, Answered_by — 결정 과정에서 이루어진 문의입니다."

[elements.OptionRecord]
display_name = "옵션 기록"
description = "주제 내에서 생성된 후보 솔루션 경로 — 제목, 설명, 평가(장점/단점/점수) —"

[elements.EvaluationDetailRecord]
display_name = "평가내역 기록"
description = "옵션의 장단점 분석 - 장점 목록, 단점 목록, 점수(0-10), 의견."

[elements.ModelingActionRecord]
display_name = "모델링 활동 기록"
description = "계획된 커널 모델 변경 — action_type(create_rule/define_entity), 대상, 설명, 상태, 페이로드 — DesignReport의 '어떻게' 실행 계획입니다."

[elements.DesignDecisionRecord]
display_name = "설계결정기록"
description = "최종 결정 — selected_option_id, 근거, 패턴 이름, 복잡성, 영향_분석, 상태, 승인자 — 승인() 수명주기 메서드 사용."

[elements.DesignReportRecord]
display_name = "설계 보고서 기록"
description = "형식적 디자인 사고 출력 - 제목, 요약, 결정, modelling_actions, key_evidence_refs - 결정 및 실행 단계를 집계하는 '계획'입니다."

[elements.DecisionPatternRecord]
display_name = "결정 패턴 기록"
description = "Frozen DecisionPattern 정의 — 이름, 설명, 복잡성, 관리_규칙_그룹, 필수_의도_태그, 조회_템플릿, 검증_휴리스틱, 결과_앵커."

[elements.PatternSchemaRecord]
display_name = "패턴 스키마 기록"
description = "의사결정 패턴에 대한 메타 모델 — 이름, PatternType(TRADE_OFF/COMPLIANCE/ARCHITECTURE/PROCESS), 단계, 휴리스틱, 조회_템플릿."

[elements.EvidenceRecord]
display_name = "증거기록"
description = "고정된 구조적 증거 — id, EvidenceType(DOCUMENT/DATA/EXPERT_OPINION/BENCHMARK/REGULATION), uri, 제목, relevance_score."

[elements.EvidenceCollectionRecord]
display_name = "증거수집기록"
description = "불변의 증거 항목 컬렉션 — add()는 새 컬렉션(기능적 추가)을 반환합니다."

[elements.EvaluationDimensionRecord]
display_name = "평가 차원 기록"
description = "단일 평가 축(이름, 설명, 가중치, 척도)은 EvaluationResult에서 가중치 점수 매기기에 사용됩니다."

[elements.RuleProvenanceRecord]
display_name = "규칙 출처 레코드"
description = "커널 브리지 출력 — Decision_ref, Report_ref — 추적성을 위해 결정을 커널 RuleAsset에 연결합니다."

[elements.EvidenceBasedDecisionGoal]
display_name = "증거 기반 의사결정 목표"
description = "핵심 원칙 - 모든 결정은 증거에 근거해야 합니다. 모든 결정은 증거에 의해 정당화되며 최종 결정 후에는 변경할 수 없습니다."

[elements.DivergeStep]
display_name = "분기 단계"
description = "주제 분기 단계 — add_research, 질문하기, add_option — 의도에 따라 옵션 생성."

[elements.ConvergeStep]
display_name = "수렴 단계"
description = "주제 수렴 단계 - finalize_plan이 옵션을 선택하고 DesignDecision 및 DesignReport를 생성합니다."

[elements.UtilizeStep]
display_name = "활용 단계"
description = "주제 활용 단계 - DesignReport 모델링 작업을 적용하여 DecisionResult 및 커널 아티팩트를 생성합니다."

[elements.ApplyPatternStep]
display_name = "패턴 적용 단계"
description = "주제에 DecisionPattern을 적용합니다. 문의_템플릿 질문과 검증_발견적 연구 노트를 자동으로 채웁니다."

[elements.ReviseReportStep]
display_name = "보고 단계 수정"
description = "추가 토론을 위해 완료된 주제를 다시 엽니다. 현재 보고서를 report_history에 보관하고 상태를 활성으로 재설정합니다."

[elements.MapDecisionToKernelAction]
display_name = "결정을 커널 작업에 매핑"
description = "커널 브리지 작업 — create_rule_provenance 및 Decision_result_from_rule_asset — 결정 출력을 커널 호환 구조로 변환합니다."

[elements.PersistTopicAction]
display_name = "주제 작업 지속"
description = "저장소 작업 — save_topic, get_topic, list_topics — 주제 집계를 위한 JSON 파일 기반 지속성."

[elements.DecisionFinalizedEvent]
