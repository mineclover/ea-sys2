# ── Deny rules ────────────────────────────────────────────────────

[[rules]]
id = "bp-deny-01"
source = "@Data"
target = "@Activity"
relation = "sequenceFlow"
valid = false
priority = 80
notes = "Data cannot participate in sequence flow with Activity"

[[rules]]
id = "bp-deny-02"
source = "@Data"
target = "@Task"
relation = "sequenceFlow"
valid = false
priority = 80
notes = "Data cannot participate in sequence flow with Task"

[[rules]]
id = "bp-deny-03"
source = "@Data"
target = "@Participant"
relation = "messageFlow"
valid = false
priority = 80
notes = "Data cannot send message flow to Participant"

[[rules]]
id = "bp-deny-04"
source = "@Participant"
target = "@Participant"
relation = "sequenceFlow"
valid = false
priority = 80
notes = "Participant cannot have sequence flow to Participant"

[[rules]]
id = "bp-deny-05"
source = "@Event"
target = "@Data"
relation = "composition"
valid = false
priority = 80
notes = "Event cannot compose Data"

[[rules]]
id = "bp-deny-06"
source = "@Gateway"
target = "@Data"
relation = "composition"
valid = false
priority = 80
notes = "Gateway cannot compose Data"

[[rules]]
id = "bp-deny-07"
source = "@Container"
target = "@Task"
relation = "composition"
valid = false
priority = 80
notes = "Container cannot directly compose Task (only via Activity)"

[[rules]]
id = "bp-deny-08"
source = "@Data"
target = "@Gateway"
relation = "sequenceFlow"
valid = false
priority = 80
notes = "Data cannot have sequence flow to Gateway"
