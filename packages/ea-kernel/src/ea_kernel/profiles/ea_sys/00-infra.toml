# ══════════════════════════════════════════════════════════════
# Implementation-Aligned Infra Elements
# Actual infrastructure concepts discovered across ea-infra,
# ea-kernel stores, ea-governance stores, and ea-needs/ea-profile.
# ══════════════════════════════════════════════════════════════

# ── Resource Indexing Service (ea-infra: ResourceIndexer + Resource) ──

[[elements]]
name = "ResourceIndexingService"
layer = "Infra"
category = "ActiveStructure"
description = "File system scanner that discovers and indexes resources. Implements ea-infra ResourceIndexer: scan() yields Resource objects with URI, path, content_type, and last_modified metadata."

[[elements]]
name = "ResourceDescriptor"
layer = "Infra"
category = "PassiveStructure"
description = "Indexed resource metadata record. Corresponds to ea-infra Resource dataclass: uri, path, name, content_type, last_modified, optional content."

# ── SQLite Storage Backend ───────────────────────────────────

[[elements]]
name = "SQLiteStorageBackend"
layer = "Infra"
category = "ActiveStructure"
description = "SQLite-based storage backend shared across all domain stores. Provides connection management, WAL mode, schema versioning, and migration support. Concrete implementation behind all *Store ABCs."

[[elements]]
name = "SchemaVersionTable"
layer = "Infra"
category = "PassiveStructure"
description = "Schema version tracking table present in every SQLite database. Enables forward-compatible schema migration across all stores."

# ── Domain Store Ports (ABC interfaces for kernel stores) ────

[[elements]]
name = "I18nStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for kernel schema translations. ABC with CRUD + history + TOML bulk import + schema audit. SQLite implementation at data/i18n.db with translations and translation_history tables."

[[elements]]
name = "RuleAssetStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for rule asset lifecycle persistence. ABC with create/get/query/transition/update_entry/history. SQLite implementation with rule_assets and rule_asset_history tables, state and domain indexes."

[[elements]]
name = "DecisionStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for judgment record persistence. ABC with store/get/query/count/statistics. SQLite implementation with decision_records and materialized judgment_statistics tables."

[[elements]]
name = "CorpusVersionStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for rule corpus version snapshots. ABC with create_version/get/get_entries/get_latest/query/history/diff. SQLite implementation with corpus_versions and version_entries tables."

[[elements]]
name = "ProfileVersionStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for profile version persistence. ea-profile StoragePort ABC with store/get/get_latest/list_versions/tag/delete. SQLite implementation at data/profiles.db with profile_versions and profile_tags tables."

# ── Domain Data Stores (concrete persistence) ────────────────

[[elements]]
name = "I18nDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Translation data store at data/i18n.db. Holds translations (PK: kind+name+lang+field) and translation_history (version audit trail) tables."

[[elements]]
name = "RuleAssetDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Rule asset data store. Holds rule_assets (current version, PK: rule_id), rule_asset_history (version trail, unique on rule_id+version), and schema_version tables. Indexed by state, domain, author, source_type."

[[elements]]
name = "DecisionDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Decision record data store. Holds decision_records (PK: storage_id) with triple/actor/judgment_json columns, and judgment_statistics (materialized, PK: source+target+relation). Indexed by triple, actor, timestamp, corpus_version."

[[elements]]
name = "CorpusVersionDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Corpus version snapshot data store. Holds corpus_versions (PK: version_id) with rule_count and rule_ids_json, and version_entries (PK: version_id+rule_id) with serialized rule and metadata JSON."

[[elements]]
name = "ProfileVersionDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Profile version data store at data/profiles.db. Holds profile_versions (PK: id, unique on profile_name+version) with content_hash and element/relation/rule counts, and profile_tags (PK: profile_name+name)."

# ── Transaction Infrastructure (ea-governance) ───────────────

[[elements]]
name = "TransactionStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for ACID transaction management and event sourcing. Corresponds to ea-governance TransactionManager: begin/commit/rollback/fail + event append. SQLite at transactions.db."

[[elements]]
name = "TransactionDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Transaction data store at transactions.db. Holds transactions (PK: id) with status/payload/logs, and transaction_events (FK: tx_id) for event sourcing. Indexed by status and updated_at."

[[elements]]
name = "TransactionEvent"
layer = "Infra"
category = "Event"
description = "Domain event appended to transaction event log. Captures event_type, message, payload per transaction. Enables event sourcing replay and audit."

# ── Governance Layer Store (ea-governance) ────────────────────

[[elements]]
name = "GovernanceLayerStorePort"
layer = "Infra"
category = "Interface"
description = "Storage port for layer-scoped governance model payloads. ABC with save_payload/get_payload/list_snapshots. 6 independent SQLite DBs at layers/{layer}.db for infra, governance, decision, needs, kernel, flow."

[[elements]]
name = "GovernanceLayerDataStore"
layer = "Infra"
category = "PassiveStructure"
description = "Layer-scoped data store at layers/{layer}.db. Each DB holds layer_models (PK: layer+model_id) with payload_json and updated_at. Indexed by layer+updated_at."

[[elements]]
name = "GovernanceKernelSnapshotStore"
layer = "Infra"
category = "PassiveStructure"
description = "Kernel snapshot store built on GovernanceLayerStore. Prefixed model_ids: rule:{id}, corpus_version:{id}, judgment:{id}. Serializes RuleAsset/CorpusVersionInfo/EnhancedJudgment to JSON payloads."

[[elements]]
name = "GovernanceNeedsSnapshotStore"
layer = "Infra"
category = "PassiveStructure"
description = "Needs catalog store built on GovernanceLayerStore. Saves NeedCatalog as JSON payload, enables catalog listing and retrieval by ID."

# ── File-Based Persistence (ea-needs) ────────────────────────

[[elements]]
name = "FileBasedPersistenceService"
layer = "Infra"
category = "ActiveStructure"
description = "File-based JSON persistence service. Implements ea-needs NeedRepository: save_catalog/get_catalog/list_catalogs using JSON files in data_dir/catalogs/. Lightweight alternative to SQLite."

[[elements]]
name = "JSONFileStore"
layer = "Infra"
category = "PassiveStructure"
description = "JSON file storage structure at data_dir/catalogs/{id}.json. Each file holds a serialized NeedCatalog. Used by ea-needs repository for lightweight persistence."

# ── Storage Layout Convention ────────────────────────────────

[[elements]]
name = "DataDirectoryLayout"
layer = "Infra"
category = "Governance"
description = "Data directory layout convention governing physical storage organization: {data_dir}/layers/{layer}.db (6 governance DBs), kernel/profiles.db (model registration), transactions.db (ACID event log), ea_kernel/data/i18n.db and profiles.db."

# ══════════════════════════════════════════════════════════════
# Rules: Resource Indexing
# ══════════════════════════════════════════════════════════════

[[rules]]
source = "ResourceIndexingService"
target = "ResourceDescriptor"
relation = "produces"
priority = 70
notes = "Resource indexer scans file system and produces resource descriptor records."

[[rules]]
source = "DataPlatformService"
target = "ResourceIndexingService"
relation = "coordinates"
priority = 70
notes = "Data platform coordinates resource indexing for content discovery."

[[rules]]
source = "ResourceIndexingService"
target = "InfraModelPort"
relation = "registers"
priority = 70
notes = "Resource indexing service registers its scanner interface via infra model port."

# ══════════════════════════════════════════════════════════════
# Rules: SQLite Storage Backend
# ══════════════════════════════════════════════════════════════

[[rules]]
source = "SQLiteStorageBackend"
target = "SchemaVersionTable"
relation = "depends_on"
priority = 70
notes = "SQLite backend depends on schema version table for migration tracking."

[[rules]]
source = "StorageLifecycleService"
target = "SQLiteStorageBackend"
relation = "coordinates"
priority = 70
notes = "Lifecycle service coordinates SQLite backend for schema init and migration."

[[rules]]
source = "StoragePolicy"
target = "SQLiteStorageBackend"
