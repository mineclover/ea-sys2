# Governance Profile Stack: Meta-Meta Model
# Role: 내부/외부 시스템이 공통으로 따르는 거버넌스 계약 어휘를 정의한다

[profile]
name = "GovernanceMetaModel"
version = "1.0.0"
kernel_version = "2.5.0"
id_prefix = "govmeta"
standard = "Governance Meta-Meta Model"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Governance boundary containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry registration contract."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Orchestration contract between governance components."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Dependency contract."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Produces governance artifact."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Consumes governance artifact."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence contract."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-triggered contract."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy constraint contract."

