# EA System: Development Topology Self-Description
# Role: 프로젝트 패키지·모듈·의존성을 커널 요소로 모델링

[profile]
name = "EASystem-Development"
version = "1.0.0"
kernel_version = "2.5.0"
id_prefix = "dev"
standard = "ea-sys2 Development Topology v1"
organization = "ea-system"

[categories]
LayerPackage = "package"
CoreService = "structure"
DataAsset = "item"
InterfacePort = "port"
PipelineStep = "step"

# ── Relations (10 standard) ──────────────────────────────────

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Package boundary containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural package dependency."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Service produces data asset."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Service consumes data asset."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Pipeline step sequence."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Quality gate constrains pipeline step."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Interface exposed in package boundary."

# ══════════════════════════════════════════════════════════════
# Elements (~50)
# ══════════════════════════════════════════════════════════════

# ── Foundation (ea-profile) ──────────────────────────────────

[[elements]]
name = "ProfileFramework"
layer = "Foundation"
category = "LayerPackage"
description = "ea-profile — kernel-agnostic profile framework (zero dep)."

[[elements]]
name = "ProfileTypes"
layer = "Foundation"
category = "CoreService"
description = "Frozen vocabulary — ProfileElement, ProfileRule, KernelProfile."

[[elements]]
name = "ProfileBuilder"
layer = "Foundation"
category = "CoreService"
description = "Fluent builder API — profile creation and composition."

[[elements]]
name = "ProfileLoader"
layer = "Foundation"
category = "CoreService"
description = "TOML → KernelProfile loading + schema validation."

[[elements]]
name = "ProfileStore"
layer = "Foundation"
category = "DataAsset"
description = "Profile version persistence (ABC→InMemory→SQLite)."

# ── Infrastructure (ea-infra) ────────────────────────────────

[[elements]]
name = "InfraLayer"
layer = "Infrastructure"
category = "LayerPackage"
description = "ea-infra — row data design, storage/indexing model."

[[elements]]
name = "ResourceIndexer"
layer = "Infrastructure"
category = "CoreService"
description = "Directory scan, file metadata collection."

[[elements]]
name = "InfraSchema"
layer = "Infrastructure"
category = "DataAsset"
description = "InfraSchema + INFRA_SCHEMA singleton (17 entities)."

# ── Decision (ea-decision) ───────────────────────────────────

[[elements]]
name = "DecisionLayer"
layer = "Decision"
category = "LayerPackage"
description = "ea-decision — decision meta-meta model."

[[elements]]
name = "TopicModel"
layer = "Decision"
category = "CoreService"
description = "Intent→Choice→Decision state transition model."

[[elements]]
name = "DecisionSchema"
layer = "Decision"
category = "DataAsset"
description = "DecisionSchema + DECISION_SCHEMA singleton (14 entities)."

[[elements]]
name = "TopicStore"
layer = "Decision"
category = "DataAsset"
description = "Topic persistence (ABC→InMemory→SQLite)."

[[elements]]
name = "DecisionBridge"
layer = "Decision"
category = "InterfacePort"
description = "profile_bridge — TOML profile loading."

# ── Needs (ea-needs) ─────────────────────────────────────────

[[elements]]
name = "NeedsLayer"
layer = "Needs"
category = "LayerPackage"
description = "ea-needs — requirements model, stakeholder needs formalization."

[[elements]]
name = "NeedCatalog"
layer = "Needs"
category = "CoreService"
description = "Aggregate root — stakeholders + needs + relations management."

[[elements]]
name = "NeedsService"
layer = "Needs"
category = "CoreService"
description = "Pure function queries (list_stakeholders, describe_need, etc.)."

[[elements]]
name = "NeedsSchema"
layer = "Needs"
category = "DataAsset"
description = "NeedsSchema + NEEDS_SCHEMA singleton (9 entities)."

[[elements]]
name = "NeedsStore"
layer = "Needs"
category = "DataAsset"
description = "Needs snapshot persistence (ABC→InMemory→SQLite)."

[[elements]]
name = "NeedsBridge"
layer = "Needs"
category = "InterfacePort"
description = "profile_bridge — TOML profile loading."

# ── Kernel (ea-kernel) ───────────────────────────────────────

[[elements]]
name = "KernelLayer"
layer = "Kernel"
category = "LayerPackage"
description = "ea-kernel — lightweight kernel metamodel (L1-L4 ontology)."

[[elements]]
name = "KernelService"
layer = "Kernel"
category = "CoreService"
description = "Service layer — UC1-UC6 pure functions, dict return."

[[elements]]
name = "RuleCorpus"
layer = "Kernel"
category = "CoreService"
description = "Rule corpus — metadata, query, evidence-based judgment."

[[elements]]
name = "JudgmentService"
layer = "Kernel"
category = "CoreService"
description = "Governance-aware judgment service (S2)."

[[elements]]
name = "GovernanceSystem"
layer = "Kernel"
category = "CoreService"
description = "GovernanceSystem facade (6-component composition)."

[[elements]]
name = "KernelSchema"
layer = "Kernel"
category = "DataAsset"
description = "Kernel schema TOML (15 entities, 14 relations, 81 rules)."

[[elements]]
name = "DecisionStoreK"
layer = "Kernel"
category = "DataAsset"
description = "Judgment record persistence."

[[elements]]
name = "RuleAssetStore"
layer = "Kernel"
category = "DataAsset"
description = "Rule asset lifecycle persistence."

[[elements]]
name = "MCPServer"
layer = "Kernel"
category = "InterfacePort"
description = "MCP server — 15+ tools (stdio transport)."

[[elements]]
name = "APIServer"
layer = "Kernel"
category = "InterfacePort"
description = "REST API server — 45+ endpoints (FastAPI)."

[[elements]]
name = "M1Pipeline"
layer = "Kernel"
category = "PipelineStep"
description = "M1 pipeline — schema + conditions + bridge 3-step."

[[elements]]
name = "S3S5Lifecycle"
layer = "Kernel"
category = "PipelineStep"
description = "S3-S5 lifecycle — store + analyzer + simulator + promotion."

# ── Flow (ea-flow) ───────────────────────────────────────────

[[elements]]
name = "FlowLayer"
layer = "Flow"
category = "LayerPackage"
description = "ea-flow — execution flow + concrete data schema spec ownership."

[[elements]]
name = "FlowRuntime"
layer = "Flow"
category = "CoreService"
description = "Execution engine — StepImplementer binding + sequential execution."

[[elements]]
name = "FlowTopology"
layer = "Flow"
category = "CoreService"
description = "Data-centric process spec (DataFlowEdge, LogicCondition)."

[[elements]]
name = "SchemaSpec"
layer = "Flow"
category = "DataAsset"
