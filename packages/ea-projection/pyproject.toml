[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-projection"
version = "0.1.0"
description = "Projection layer for EA System: Abstraction and Indexing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["projection", "abstraction", "indexing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "ea-profile>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ea_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_projection"
