[project]
name = "ea-sys2"
version = "0.1.0"
description = "EA System - Kernel, Decision, Flow, Governance & Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ea-kernel",
    "ea-kernel-contract",
    "ea-kernel-self",
    "ea-needs",
    "ea-decision",
    "ea-flow",
    "ea-governance",
    "ea-infra",
    "ea-projection",
    "ea-profile",
    "sdlc-domain",
]

[project.optional-dependencies]
dev = [
    "ea-kernel[api,mcp,typedb]",
    "pytest>=7.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "ea-kernel[api,mcp,typedb]",
    "pytest>=7.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv.workspace]
members = [
    "packages/ea-kernel",
    "packages/ea-kernel-contract",
    "packages/ea-kernel-self",
    "packages/ea-needs",
    "packages/ea-decision",
    "packages/ea-flow",
    "packages/ea-governance",
    "packages/ea-infra",
    "packages/ea-projection",
    "packages/ea-profile",
    "packages/sdlc-domain",
]

[tool.uv.sources]
ea-kernel = { workspace = true }
ea-kernel-contract = { workspace = true }
ea-kernel-self = { workspace = true }
ea-needs = { workspace = true }
ea-decision = { workspace = true }
ea-flow = { workspace = true }
ea-governance = { workspace = true }
ea-infra = { workspace = true }
ea-projection = { workspace = true }
ea-profile = { workspace = true }
sdlc-domain = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
addopts = "--import-mode=importlib"
