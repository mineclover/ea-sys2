# Governance Profile Stack: External Integration Profile
# Role: 외부 시스템 연동용 거버넌스 계약을 정의한다

[profile]
name = "ExternalIntegrationGovernanceModel"
version = "0.1.0"
kernel_version = "2.5.0"
id_prefix = "extgov"
standard = "Governance External Integration"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership relation."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration relation."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Dependency relation."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Produces records/events."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Consumes records/events."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequencing relation."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event trigger relation."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy constraint relation."

