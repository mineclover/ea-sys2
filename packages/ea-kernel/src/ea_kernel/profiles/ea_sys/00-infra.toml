target = "GovernanceDataMigration"
relation = "contains"
priority = 65
notes = "Infra-Gov: governance model port exposes data migration."

[[rules]]
source = "DataPlatformService"
target = "GovernanceStorageSchema"
relation = "depends_on"
priority = 72
notes = "Infra-Gov: platform service depends on governance storage schema for row access."

[[rules]]
source = "StorageLifecycleService"
target = "GovernanceDataMigration"
