[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-kernel"
version = "2.5.0"
description = "Lightweight kernel metamodel inspired by KerML, backed by TypeDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["metamodel", "kernel", "typedb", "enterprise-architecture", "kerml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Core: pure Python schema parser + kernel definitions
# TypeDB dependency only for runtime schema loading
dependencies = []

[project.optional-dependencies]
typedb = [
    "typedb-driver>=3.7.0",
]
mcp = [
    "mcp>=1.12.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/your-org/ea-kernel"

[tool.hatch.build.targets.wheel]
packages = ["src/ea_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_kernel"
