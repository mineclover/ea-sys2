[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-governance"
version = "0.1.0"
description = "Governance System Integration - Unifies Kernel, Decision, and Flow layers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["governance", "integration", "facade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "ea-kernel>=2.5.0",
    "ea-decision>=0.1.0",
    "ea-flow>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ea_governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_governance"
