description = "Structured decision context instance record."

[[elements]]
name = "DecisionOptionRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured option graph instance record."

[[elements]]
name = "DecisionEvaluationRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured evaluation instance record."

[[elements]]
name = "DecisionOutcomeRecord"
layer = "Decision"
category = "PassiveStructure"
description = "Structured final decision outcome record."

[[elements]]
name = "DecisionTraceGoal"
layer = "Decision"
category = "Goal"
description = "Goal for traceable and reproducible decision-flow instances."

[[elements]]
name = "CaptureDecisionContextStep"
layer = "Decision"
category = "Behavior"
description = "Step that materializes decision context nodes."

[[elements]]
name = "BuildOptionGraphStep"
layer = "Decision"
category = "Behavior"
description = "Step that materializes option node graph."

[[elements]]
name = "EvaluateOptionGraphStep"
layer = "Decision"
category = "Behavior"
description = "Step that evaluates option graph into comparable records."

[[elements]]
name = "FinalizeDecisionStep"
layer = "Decision"
category = "Behavior"
description = "Step that closes evaluation into an outcome record."

[[elements]]
name = "PublishDecisionModelAction"
layer = "Decision"
category = "Executable"
description = "Action that publishes decision-flow model instances for needs-stage handoff."

[[elements]]
name = "DecisionRequestedEvent"
layer = "Decision"
category = "Event"
description = "Raised when a new decision-flow instance is requested."

[[elements]]
name = "DecisionUpdatedEvent"
layer = "Decision"
category = "Event"
description = "Raised when upstream context changes require reevaluation."

