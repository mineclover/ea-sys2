# EA System Layer Stack (governance domain)

[profile]
name = "EASystem-LayerStack"
version = "0.1.0"
kernel_version = "2.5.0"
id_prefix = "eals"
standard = "EA System Layer Stack"
organization = "ea-sys"

[layer_stack]
definition_flow = "infra -> decision -> needs -> kernel -> flow"
runtime_flow = "governance -> decision -> needs -> kernel -> flow"
feedback_flow = "flow -> governance -> decision -> needs -> kernel -> infra"

[[layer_stack.layers]]
name = "infra"
order = 0
depends_on = []
responsibility = "Row-data schema and persistence contract design."
model_perspective = "row-data-design"

[[layer_stack.layers]]
name = "decision"
order = 20
depends_on = ["infra"]
responsibility = "Decision meta-model and policy choice structure."
model_perspective = "decision-meta-model"

[[layer_stack.layers]]
name = "needs"
order = 30
depends_on = ["decision"]
responsibility = "Need/requirement model and prioritization context."
model_perspective = "requirements-model"

[[layer_stack.layers]]
name = "kernel"
order = 40
depends_on = ["needs"]
responsibility = "Core domain model and invariant contracts."
model_perspective = "domain-core-model"

[[layer_stack.layers]]
name = "flow"
order = 50
depends_on = ["kernel"]
responsibility = "Executable flow and dataflow topology model."
model_perspective = "execution-flow-model"

[[layer_stack.layers]]
name = "governance"
order = 60
depends_on = ["infra", "decision", "needs", "kernel", "flow"]
responsibility = "Cross-layer management entrypoint and control-plane policy."
model_perspective = "management-control-plane"
