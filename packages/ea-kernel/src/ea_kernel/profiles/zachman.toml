name = "transforms_to"
kernel_relation = "specialization"
description = "Vertical refinement between perspectives"

[[relations]]
name = "derives_from"
kernel_relation = "specialization"
description = "Derivation from higher abstraction"

[[relations]]
name = "composition"
kernel_relation = "ownership"
description = "Part-whole structural relationship"

[[relations]]
name = "aggregation"
kernel_relation = "membership"
description = "Grouping without lifecycle dependency"

[[relations]]
name = "uses"
kernel_relation = "association"
description = "Element uses another element"

[[relations]]
name = "located_at"
kernel_relation = "association"
description = "Element is located at a place"

[[relations]]
name = "performed_by"
kernel_relation = "association"
description = "Process performed by organizational unit"

[[relations]]
name = "triggered_by"
kernel_relation = "succession"
description = "Process or event triggered by a schedule"

[[relations]]
name = "motivated_by"
kernel_relation = "association"
description = "Element motivated by strategy"

[[relations]]
name = "flow"
kernel_relation = "flow"
description = "Data or process flow between elements"

[[relations]]
name = "triggers"
kernel_relation = "succession"
description = "Temporal causal relationship"

[[relations]]
name = "association"
kernel_relation = "association"
description = "General unspecified relationship"

# ═══════════════════════════════════════════════════════════════════
# Validity Rules — 31 allow rules (no fallback rules)
# ═══════════════════════════════════════════════════════════════════

# ── transforms_to (specialization): vertical refinement ──────────

[[rules]]
id = "zf-trans-01"
source = "*"
target = "*"
relation = "transforms_to"
priority = 50
conditions = ["SAME_CATEGORY"]
notes = "Vertical transformation within same interrogative column"

# ── derives_from (specialization): column derivation ─────────────

[[rules]]
id = "zf-deriv-01"
source = "@What"
target = "@What"
relation = "derives_from"
priority = 40
notes = "What column derivation"

[[rules]]
id = "zf-deriv-02"
source = "@How"
target = "@How"
relation = "derives_from"
priority = 40
notes = "How column derivation"

[[rules]]
