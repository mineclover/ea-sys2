priority = 60
notes = "Experiences contain data artifacts."

# ── Pattern: Context → Experience ────────────────────────

[[rules]]
source = "@Context"
target = "@Composite"
relation = "available_in"
priority = 60
notes = "Contexts provide access to experiences."

# ── Pattern: Goal → Behavior Constraint ──────────────────

[[rules]]
source = "@Goal"
target = "@Behavior"
relation = "constrains"
priority = 60
notes = "Goals constrain interactive behaviors."

[[rules]]
source = "@Goal"
target = "@Executable"
relation = "constrains"
priority = 60
notes = "Goals constrain executable actions."

# ── Pattern: Page ↔ Endpoint ─────────────────────────────

[[rules]]
source = "@Page"
target = "@Interface"
relation = "coordinates"
priority = 60
notes = "Pages coordinate with API endpoints."

# ── Pattern: Layout ↔ Page ───────────────────────────────

[[rules]]
source = "@Layout"
target = "@Page"
