[elements.KernelSpecVersion]
display_name = "커널 스펙 버전"
description = "흐름 보기 — 계약 정렬을 위한 커널 사양 버전 메타데이터입니다."

[elements.KernelConstraintHook]
display_name = "커널 제약 훅"
description = "흐름 보기 — 흐름 실행 중에 커널 유효성 검사를 호출하기 위한 후크입니다."

[elements.FlowSimulatorEngine]
display_name = "흐름 시뮬레이터 엔진"
description = "토폴로지 변경 영향 시뮬레이터. 적용 전 변경 집합을 실행 이력에 재적용해 영향을 평가한다."

[elements.TopologyChangeRequest]
display_name = "토폴로지 변경 요청"
description = "토폴로지 변경 요청 데이터. change_type, step_name, workflow_name, new_position, start_condition을 포함한다."

[elements.TopologyChangeTypeEnum]
display_name = "토폴로지 변경 유형 열거형"
description = "토폴로지 변경 유형 enum. ADD_STEP, REMOVE_STEP, REORDER_STEP, PATCH_START_CONDITION 값을 가진다."

[elements.StartConditionSpecData]
display_name = "시작 조건 명세 데이터"
description = "명시적 시작 조건 계약 데이터. 대상/소스 스텝, kind, 필드 매핑, 조건식, canonical 식별자를 포함한다."

[elements.StartConditionKindEnum]
display_name = "시작 조건 유형 열거형"
description = "시작 조건 엣지 유형 enum. CONTROL_EDGE, DATA_EDGE, EVENT_TRIGGER 값을 가진다."

[elements.TopologySimulationResultData]
display_name = "토폴로지 시뮬레이션 결과"
description = "토폴로지 시뮬레이션 결과 데이터. 영향받은 실행 수, impact level, 의존/시작조건 위반, risk factor, safe_to_apply를 보고한다."

[elements.SpecificationPlane]
display_name = "사양 평면"
description = "P1 사양 평면 — 선언적 단계/워크플로/스키마 정의를 위한 컨테이너입니다."

[elements.StepSpecContract]
display_name = "단계 사양 계약"
description = "P1 - 추상 단계 사양 계약(ABC). 이름, kernel_anchor, Meta_type, input/output_schema를 정의합니다."

[elements.FlowMetaStepDefinition]
display_name = "흐름 메타 단계 정의"
description = "P1 - 재사용 가능한 논리 패턴(FlowMetaStep)의 공식 정의입니다. 이름, 설명, input/output_schema, kernel_type_requirement가 포함된 고정된 데이터 클래스입니다."

[elements.KernelGroundedStepSpecType]
display_name = "커널 접지 단계 사양 유형"
description = "P1 — StepSpec은 기본적으로 kernel_anchor를 통해 커널 요소에 고정됩니다. FlowMetaStep에서 Meta_type을 상속합니다."

[elements.WorkflowSpecContract]
display_name = "워크플로 사양 계약"
description = "P1 - 추상 작업 흐름 사양 계약(ABC)입니다. 이름, kernel_anchor, input/output_schema, get_steps()를 정의합니다."

[elements.UseCaseSpecType]
display_name = "사용 사례 사양 유형"
description = "P1 — 최고 수준의 비즈니스 프로세스 정의(UseCaseSpec). Primary_actor 및 Success_Criteria가 포함된 구체적인 WorkflowSpec입니다."

[elements.ExecutionContextData]
display_name = "실행 컨텍스트 데이터"
description = "P1 — 불변 실행 컨텍스트(ExecutionContext). 워크플로를 통해 전달된 Execution_id 및 변수 dict를 포함합니다."

[elements.StepResultSpecData]
display_name = "단계 결과 사양 데이터"
description = "P1 — 예상 단계 결과 구조에 대한 사양(StepResultSpec) 출력_스키마 및 예상_로그_패턴을 포함합니다."

[elements.FlowGenerationRuleData]
display_name = "흐름 생성 규칙 데이터"
description = "P1 — 커널 엔터티(FlowGenerationRule)에서 흐름 사양을 생성하기 위한 규칙입니다. logic_conditions를 사용하여 source_kernel_type을 target_flow_type에 매핑합니다."

[elements.FlowTopologyData]
display_name = "흐름 토폴로지 데이터"
description = "P1 — 선언적 프로세스 구조(FlowTopology). 단계, 진입/종료 지점, 전환_규칙 및 생성_규칙을 포함합니다."

[elements.CoordinationPlane]
display_name = "조정 평면"
description = "P2 조정 평면 — 프로세스 그래프, 데이터 흐름 가장자리, 조건 및 변환을 위한 컨테이너입니다."

[elements.ProcessSpecType]
display_name = "프로세스 사양 유형"
description = "P2 — 프로세스(ProcessSpec)에 대한 루트 온톨로지 엔터티입니다. 단계, Trigger_event, Defined_schemas 및 data_flow_edges를 포함합니다."

[elements.StepDefinitionNode]
display_name = "단계 정의 노드"
description = "P2 - 프로세스 그래프의 단일 노드(StepDefinition) ID, 이름, 카테고리, 조건, 변환, 스키마_사용, 라우팅이 있습니다."

[elements.DataFlowEdgeLink]
display_name = "데이터 흐름 엣지 링크"
description = "P2 — 단계 간 데이터 이동 정의(DataFlowEdge) 선택적 변환_rule을 사용하여 source_step.source_field를 target_step.target_field에 매핑합니다."

[elements.LogicConditionExpr]
display_name = "논리 조건 표현"
description = "P2 - 조건식(LogicCondition). 표현식 문자열, 엔진 유형(json-logic/python/sql) 및 매개변수를 포함합니다."

[elements.DataTransformationSpec]
display_name = "데이터 변환 사양"
description = "P2 - 데이터 형태 변환(DataTransformation). mapping_rules를 사용하여 input_schema를 output_schema로 정의합니다."

[elements.SchemaDefinitionData]
display_name = "스키마 정의 데이터"
description = "P2 — 데이터 형태 정의(SchemaDefinition). ID, 이름, Schema_format 및 정의 dict가 있습니다."

[elements.StepSchemaUsageSpec]
display_name = "단계 스키마 사용 사양"
description = "P2 - 단계 데이터 계약(StepSchemaUsage). 단계에 대한 input/output_schema_id 및 필수_필드를 선언합니다."

[elements.FlowOntologyRegistry]
display_name = "흐름 온톨로지 레지스트리"
description = "P2 - 프로세스 사양 유형에 대한 레지스트리(FlowOntology) 정적 explain() 메소드는 등록된 유형을 열거합니다."

[elements.FlowStepCategoryEnum]
display_name = "흐름 단계 범주 열거형"
description = "단계 역할 분류 열거형(FlowStepCategory). 값: 행동, 결정, 이벤트, 게이트웨이, 변화."

[elements.RealizationPlane]
display_name = "실현면"
description = "P3 실현 평면 — 런타임 해석기, 구현자 및 실행 결과를 위한 컨테이너입니다."

[elements.FlowRuntimeEngine]
display_name = "흐름 런타임 엔진"
description = "P3 — 워크플로 해석기(FlowRuntime). 실패 시 보상 롤백을 통해 순차적 단계 실행."

[elements.StepImplementerContract]
display_name = "단계 구현자 계약"
description = "P3 — 추상 단계 실행 인터페이스(StepImplementer ABC). Execute() 및 Rollback()을 정의하여 트랜잭션 패턴을 보상합니다."

[elements.StepInterpretationResultData]
display_name = "단계 해석 결과 데이터"
description = "P3 — 선언적 해석 결과(StepInterpretationResult). 허용된 의도, 로그가 포함된 고정된 데이터 클래스입니다."

[elements.StepExecutionResultData]
display_name = "단계 실행 결과 데이터"
description = "P3 - 이전 버전과 호환되는 별칭(StepExecutionResult는 StepInterpretationResult를 확장함) 레거시 코드와 동일한 구조입니다."

[elements.FlowExecutionResultData]
display_name = "흐름 실행 결과 데이터"
description = "P3 — 전체 워크플로 결과(FlowExecutionResult). 워크플로우_이름, 실행_ID, 성공, 단계_결과, 롤백_occurred를 포함합니다."

[elements.SchemaSpecContract]
display_name = "스키마 사양 계약"
description = "스키마 사양 인터페이스(SchemaSpec ABC). 형식별 스키마 구현을 위해 verify() 및 to_dict()를 정의합니다."

[elements.JsonSchema2020SpecType]
display_name = "Json Schema2020 사양 유형"
description = "JSON 스키마 2020-12 구현(JsonSchema2020Spec). jsonschema 라이브러리를 사용하여 원시 JSON 스키마에 대해 데이터의 유효성을 검사합니다."

[elements.DbSchemaSpecType]
display_name = "Db 스키마 사양 유형"
description = "데이터베이스 스키마 구현(DbSchemaSpec). table_name, 열 및 선택적 ddl이 포함된 DDL 접근 방식 테이블/뷰 스키마입니다."

[elements.StepInputSchemaData]
display_name = "단계 입력 스키마 데이터"
description = "P1 — 단계당 형식적인 입력 데이터 형태입니다. 단계에서 사용되는 필드 이름, 유형, 필수/선택적 플래그 및 기본값을 선언합니다."

[elements.StepOutputSchemaData]
display_name = "단계 출력 스키마 데이터"
description = "P1 - 단계별 형식적 출력 데이터 형태. 성공적인 실행 시 단계에서 생성된 필드 이름, 유형 및 보장을 선언합니다."

[elements.DataContractSpec]
display_name = "데이터 계약 사양"
description = "P2 - 생산자-소비자 스키마 일치 계약입니다. 호환성 모드(엄격/호환/완화)를 사용하여 생산자 단계의 출력 스키마를 소비자 단계의 입력 스키마에 바인딩합니다."

[elements.SchemaVersionRecord]
display_name = "스키마 버전 레코드"
description = "P2 - 스키마 버전 메타데이터입니다. 스키마 발전을 위해 version_id, parent_version,change_type(추가/중단/호환) 및 migration_hint를 추적합니다."

[elements.DataCatalogRegistry]
display_name = "데이터 카탈로그 레지스트리"
description = "P2 - 단계 및 워크플로 전반에 걸쳐 사용되는 모든 데이터 스키마의 흐름 소유 레지스트리입니다. Schema_id, 버전, 호환성 쿼리를 기준으로 조회를 제공합니다."

[elements.SchemaCompatibilityRule]
display_name = "스키마 호환성 규칙"
description = "P2 — 스키마 진화 호환성 규칙. 스키마 변경(추가/파괴/호환)이 기존 소비자에게 안전한지 여부를 평가합니다."

[elements.DataQualityGate]
display_name = "데이터 품질 게이트"
description = "P2 — 스키마 경계의 데이터 품질 검증 제약 조건. 단계 입력/출력에 null 허용 여부, 범위, 형식 및 필드 간 일관성 규칙을 적용합니다."

[elements.DataLineageRecord]
display_name = "데이터 계보 기록"
description = "P3 - 데이터 출처 레코드입니다. 각 데이터 필드를 생성한 단계, 사용된 스키마 버전, 흐름을 통한 변환 경로를 추적합니다."

[elements.AddRuleStepSpecType]
display_name = "규칙 단계 사양 유형 추가"
description = "커널 작업 — 새 규칙을 추가하기 위한 선언적 단계 사양(AddRuleStepSpec). rule_asset_data 및 kernel_anchor를 전달합니다."

[elements.DeprecateRuleStepSpecType]
display_name = "규칙 단계 사양 유형 지원 중단"
description = "커널 작업 — 규칙 사용 중단을 위한 선언적 단계 사양(DeprecateRuleStepSpec) rule_id 및 kernel_anchor를 전달합니다."

[elements.AddRuleImplementerType]
display_name = "규칙 구현자 유형 추가"
description = "P3 — 커널 규칙 생성 구현자(AddRuleImplementer). AddRuleStepSpec을 kernel.submit_rule 인텐트로 해석합니다."

[elements.DeprecateRuleImplementerType]
display_name = "규칙 구현자 유형 지원 중단"
description = "P3 — 커널 규칙 지원 중단 구현자(DeprecateRuleImplementer). DeprecateRuleStepSpec을 kernel.deprecate_rule 인텐트로 해석합니다."

[elements.FlowProfileType]
display_name = "흐름 프로필 유형"
description = "도메인별 메타 단계 컬렉션(FlowProfile). 이름, 버전, Meta_steps 튜플, 메타데이터가 포함된 고정된 데이터 클래스입니다."

[relations.contains]
display_name = "포함"
description = "네임스페이스 또는 구성요소 포함."

[relations.registers]
display_name = "등록"
description = "구성 요소와 포트 간의 레지스트리 멤버십입니다."

[relations.coordinates]
display_name = "조율"
description = "런타임 오케스트레이션 또는 협업 연결."

[relations.depends_on]
display_name = "의존"
description = "데이터 또는 정책에 대한 구조적 종속성."

[relations.produces]
display_name = "생산"
description = "행동은 인공물을 생산합니다."

[relations.consumes]
display_name = "소비"
description = "행동은 아티팩트를 소비합니다."

[relations.next]
display_name = "다음"
description = "실행 순서 전환."

[relations.triggers]
display_name = "트리거"
description = "이벤트 기반 실행 트리거."

[relations.constrains]
display_name = "제약"
description = "정책이나 가드가 실행을 제한합니다."

[relations.available_in]
display_name = "가용"
description = "컨텍스트는 경험이나 요소에 대한 액세스를 제공합니다."

