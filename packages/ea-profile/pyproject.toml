[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-profile"
version = "0.1.0"
description = "Profile framework for EA System - kernel-agnostic profile types, builder, and lifecycle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["profile", "metamodel", "enterprise-architecture", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ea_profile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_profile"
