[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ea-kernel-self"
version = "0.1.0"
description = "Self-check runtime package built on top of ea-kernel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["ea", "kernel", "self-model", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ea-kernel>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ea-kernel-self = "ea_kernel_self.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ea_kernel_self"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ea_kernel_self"
