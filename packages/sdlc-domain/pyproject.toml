[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdlc-domain"
version = "0.1.0"
description = "SDLC Domain Layer for EA System - Snapshot Store with profile-validated transitions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "EA System Team" }
]
keywords = ["sdlc", "store", "snapshot", "recording", "transition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "ea-kernel>=2.5.0",
    "ea-profile>=0.1.0",
    "ea-projection>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=sdlc_domain"
