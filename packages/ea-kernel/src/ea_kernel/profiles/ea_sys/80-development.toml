[[elements]]
name = "FlowSchema"
layer = "Flow"
category = "DataAsset"
description = "FlowSchema + FLOW_SCHEMA singleton (21 entities)."

[[elements]]
name = "ExecutionStore"
layer = "Flow"
category = "DataAsset"
description = "Workflow execution record persistence."

[[elements]]
name = "FlowBridge"
layer = "Flow"
category = "InterfacePort"
description = "profile_bridge — TOML profile loading."

# ── Management (ea-governance) ───────────────────────────────

[[elements]]
name = "GovernanceLayer"
layer = "Management"
category = "LayerPackage"
description = "ea-governance — 5-layer management system."

[[elements]]
name = "GovernanceFacade"
layer = "Management"
category = "CoreService"
description = "GovernanceContainer — single public entry point."

[[elements]]
name = "GovernanceService"
layer = "Management"
category = "CoreService"
description = "Pure function queries (dashboard, cross_layer_summary, etc.)."

[[elements]]
name = "LayerStore"
layer = "Management"
category = "DataAsset"
description = "6-layer snapshot persistence (SQLite)."

[[elements]]
name = "GovernanceRouter"
layer = "Management"
category = "InterfacePort"
description = "FastAPI APIRouter plugin (5 endpoints)."

# ── Visualization (web-kernel-viz) ───────────────────────────

[[elements]]
name = "VizLayer"
layer = "Visualization"
category = "LayerPackage"
description = "web-kernel-viz — kernel topology visualization (Vite+React)."

[[elements]]
name = "VizApp"
layer = "Visualization"
category = "CoreService"
description = "React SPA — topology graph + rule browser."

# ══════════════════════════════════════════════════════════════
# Rules
# ══════════════════════════════════════════════════════════════

# ── Category-level: Containment ──────────────────────────────

[[rules]]
id = "dev-contain-01"
source = "@LayerPackage"
target = "@CoreService"
relation = "contains"
priority = 50
notes = "Package boundary contains core services."

[[rules]]
id = "dev-contain-02"
source = "@LayerPackage"
target = "@DataAsset"
relation = "contains"
priority = 50
notes = "Package boundary contains data assets."

[[rules]]
id = "dev-contain-03"
source = "@LayerPackage"
target = "@InterfacePort"
relation = "contains"
priority = 50
notes = "Package boundary contains interface ports."

[[rules]]
id = "dev-contain-04"
source = "@LayerPackage"
target = "@PipelineStep"
relation = "contains"
priority = 50
notes = "Package boundary contains pipeline steps."

# ── Category-level: Data Flow ────────────────────────────────

[[rules]]
id = "dev-flow-01"
source = "@CoreService"
target = "@DataAsset"
relation = "produces"
priority = 50
notes = "Services produce data assets."

[[rules]]
id = "dev-flow-02"
source = "@CoreService"
target = "@DataAsset"
relation = "consumes"
priority = 50
notes = "Services consume data assets."

[[rules]]
id = "dev-flow-03"
source = "@PipelineStep"
target = "@DataAsset"
relation = "produces"
priority = 50
notes = "Pipeline steps produce data assets."

[[rules]]
id = "dev-flow-04"
source = "@PipelineStep"
target = "@DataAsset"
relation = "consumes"
priority = 50
notes = "Pipeline steps consume data assets."

# ── Category-level: Coordination & Sequence ──────────────────

[[rules]]
id = "dev-coord-01"
source = "@InterfacePort"
target = "@LayerPackage"
relation = "available_in"
priority = 50
notes = "Interfaces expose package capabilities."

[[rules]]
id = "dev-coord-02"
source = "@PipelineStep"
target = "@PipelineStep"
relation = "next"
priority = 50
notes = "Pipeline steps form sequences."

[[rules]]
id = "dev-coord-03"
source = "@CoreService"
target = "@CoreService"
relation = "coordinates"
priority = 50
notes = "Services coordinate with each other."

