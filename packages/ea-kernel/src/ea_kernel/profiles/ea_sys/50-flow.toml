# EA System Layer: Flow
# Role: 실행/데이터 흐름 모델 정의
#
# 3-Plane Execution Model (ea-flow implementation):
#   P1 Specification — 선언적 정의 (StepSpec, WorkflowSpec, SchemaSpec)
#   P2 Coordination  — 조율/그래프 (ProcessSpec, DataFlowEdge, LogicCondition)
#   P3 Realization    — 명령적 실행 (FlowRuntime, StepImplementer)

[profile]
name = "EASystemLayerModel"
version = "0.4.1"
kernel_version = "2.5.0"
id_prefix = "eas"
standard = "EA System Layer Contracts"
organization = "ea-sys"

[categories]
Composite = "package"
ActiveStructure = "structure"
Interface = "port"
Behavior = "step"
Executable = "action"
PassiveStructure = "item"
Event = "event"
Assessment = "expression"
Governance = "feature"
Goal = "state"
Context = "state"
Page = "structure"

[[relations]]
name = "contains"
kernel_relation = "ownership"
description = "Namespace or component containment."

[[relations]]
name = "registers"
kernel_relation = "membership"
description = "Registry membership between components and ports."

[[relations]]
name = "coordinates"
kernel_relation = "association"
description = "Runtime orchestration or collaboration linkage."

[[relations]]
name = "depends_on"
kernel_relation = "association"
description = "Structural dependency on data or policies."

[[relations]]
name = "produces"
kernel_relation = "flow"
direction = "out"
description = "Behavior produces artifacts."

[[relations]]
name = "consumes"
kernel_relation = "flow"
direction = "in"
description = "Behavior consumes artifacts."

[[relations]]
name = "next"
kernel_relation = "succession"
description = "Execution sequence transition."

[[relations]]
name = "triggers"
kernel_relation = "triggering"
description = "Event-driven execution trigger."

[[relations]]
name = "constrains"
kernel_relation = "association"
description = "Policy or guard constrains execution."

[[relations]]
name = "available_in"
kernel_relation = "association"
description = "Context provides access to an experience or element."

[[elements]]
name = "FlowLayer"
layer = "Flow"
category = "Composite"
description = "Flow modeling boundary and runtime chain terminal stage."

[[elements]]
name = "InfraModelPort"
layer = "Infra"
category = "Interface"
description = "7x7 contract port for infra-layer model interface."

[[elements]]
name = "GovernanceModelPort"
layer = "Governance"
category = "Interface"
description = "7x7 contract port for governance-layer model interface."

[[elements]]
name = "DecisionModelPort"
layer = "Decision"
category = "Interface"
description = "7x7 contract port for decision-layer model interface."

[[elements]]
name = "NeedsModelPort"
layer = "Needs"
category = "Interface"
description = "7x7 contract port for needs-layer model interface."

[[elements]]
name = "KernelModelPort"
layer = "Kernel"
category = "Interface"
description = "7x7 contract port for kernel-layer model interface."

[[elements]]
name = "FlowModelPort"
layer = "Flow"
category = "Interface"
description = "7x7 contract port for flow-layer model interface."

[[elements]]
name = "ProjectionModelPort"
layer = "Projection"
category = "Interface"
description = "7x7 contract port for projection-layer model interface."

[[elements]]
name = "ContextIngestStep"
layer = "Flow"
category = "Behavior"
description = "Collects initial needs context handed off from upstream decision/needs modeling."

[[elements]]
name = "NormalizeNeedStep"
layer = "Flow"
category = "Behavior"
description = "Normalizes needs and constraint information."

[[elements]]
name = "BuildKernelInputStep"
layer = "Flow"
category = "Behavior"
description = "Builds kernel-ready input payload."

[[elements]]
name = "MapKernelSpecStep"
layer = "Flow"
category = "Behavior"
description = "Maps payload to active kernel contract/version from kernel-stage handoff."

[[elements]]
name = "ExecuteKernelAction"
layer = "Flow"
category = "Executable"
description = "Executes contracted work/action."

[[elements]]
name = "VerifyOutcomeStep"
layer = "Flow"
category = "Behavior"
description = "Verifies execution output against expected constraints."

[[elements]]
name = "PersistFlowStateStep"
layer = "Flow"
category = "Behavior"
description = "Persists flow state/validation traces and publishes layer-contract matrix ownership."

[[elements]]
name = "PublishFlowOutcomeAction"
layer = "Flow"
category = "Executable"
description = "Publishes final flow outcome snapshots."

[[elements]]
name = "LayerVersionStore"
layer = "Infra"
category = "PassiveStructure"
description = "Infra version store consumed by flow mapping."

[[elements]]
name = "ValidationRunStore"
layer = "Infra"
category = "PassiveStructure"
description = "Infra validation store consumed/updated by flow."

[[elements]]
name = "UseCaseCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Needs use-case catalog consumed by flow ingestion."

[[elements]]
name = "ActorContextCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Needs actor context consumed by flow ingestion."

[[elements]]
name = "ConstraintCatalog"
layer = "Needs"
category = "PassiveStructure"
description = "Needs constraints consumed by normalization."

[[elements]]
name = "PrioritizedNeedSet"
layer = "Needs"
category = "PassiveStructure"
description = "Prioritized needs consumed by planning steps."

[[elements]]
name = "FlowPlanningPolicy"
layer = "Flow"
category = "Assessment"
description = "Flow-local policy for planning and kernel input composition."

[[elements]]
name = "FlowExecutionPolicy"
layer = "Flow"
category = "Assessment"
description = "Flow-local policy for execution and verification safety."

[[elements]]
name = "KernelInputDraft"
layer = "Flow"
category = "PassiveStructure"
description = "Intermediate kernel input draft produced by flow."

[[elements]]
name = "ContractedPlanDraft"
layer = "Flow"
category = "PassiveStructure"
description = "Kernel-contracted plan draft used for execution."

[[elements]]
name = "FlowLayerContractMatrix"
layer = "Flow"
category = "PassiveStructure"
description = "Flow-owned 7x7 cross-layer contract matrix (single owner artifact)."

# ─────────────────────────────────────────────────────────────
# P1 Specification Plane — Declarative Definitions (spec.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "SpecificationPlane"
layer = "Flow"
category = "Composite"
description = "P1 Specification plane — container for declarative step/workflow/schema definitions."

[[elements]]
name = "StepSpecContract"
layer = "Flow"
category = "Interface"
description = "P1 — Abstract step specification contract (ABC). Defines name, kernel_anchor, meta_type, input/output_schema."

[[elements]]
name = "FlowMetaStepDefinition"
layer = "Flow"
category = "PassiveStructure"
description = "P1 — Formal definition of a reusable logic pattern (FlowMetaStep). Frozen dataclass with name, description, input/output_schema, kernel_type_requirement."

[[elements]]
name = "KernelGroundedStepSpecType"
layer = "Flow"
category = "Behavior"
description = "P1 — StepSpec natively anchored to a kernel element via kernel_anchor. Inherits meta_type from FlowMetaStep."

[[elements]]
name = "WorkflowSpecContract"
layer = "Flow"
category = "Interface"
description = "P1 — Abstract workflow specification contract (ABC). Defines name, kernel_anchor, input/output_schema, get_steps()."

[[elements]]
name = "UseCaseSpecType"
layer = "Flow"
category = "Behavior"
description = "P1 — First-class business process definition (UseCaseSpec). Concrete WorkflowSpec with primary_actor and success_criteria."

[[elements]]
name = "ExecutionContextData"
layer = "Flow"
category = "PassiveStructure"
description = "P1 — Frozen execution context (ExecutionContext). Contains execution_id and variables dict passed through workflow."

[[elements]]
name = "StepResultSpecData"
layer = "Flow"
category = "PassiveStructure"
description = "P1 — Specification for expected step result structure (StepResultSpec). Contains output_schema and expected_log_patterns."

[[elements]]
name = "FlowGenerationRuleData"
layer = "Flow"
category = "Assessment"
description = "P1 — Rule for generating flow specifications from kernel entities (FlowGenerationRule). Maps source_kernel_type to target_flow_type with logic_conditions."

[[elements]]
name = "FlowTopologyData"
layer = "Flow"
category = "PassiveStructure"
description = "P1 — Declarative process structure (FlowTopology). Contains steps, entry/exit points, transition_rules, and generation_rules."

# ─────────────────────────────────────────────────────────────
# P2 Coordination Plane — Process Graph (topology.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "CoordinationPlane"
layer = "Flow"
category = "Composite"
description = "P2 Coordination plane — container for process graph, data flow edges, conditions, and transformations."

[[elements]]
name = "ProcessSpecType"
layer = "Flow"
category = "ActiveStructure"
description = "P2 — Root ontology entity for a process (ProcessSpec). Contains steps, trigger_event, defined_schemas, and data_flow_edges."

[[elements]]
name = "StepDefinitionNode"
layer = "Flow"
category = "Behavior"
description = "P2 — Single node in the process graph (StepDefinition). Has id, name, category, condition, transformation, schema_usage, routing."

[[elements]]
name = "DataFlowEdgeLink"
layer = "Flow"
category = "PassiveStructure"
description = "P2 — Data movement definition between steps (DataFlowEdge). Maps source_step.source_field to target_step.target_field with optional transformation_rule."

[[elements]]
name = "LogicConditionExpr"
layer = "Flow"
category = "Assessment"
description = "P2 — Conditional expression (LogicCondition). Contains expression string, engine type (json-logic/python/sql), and parameters."

[[elements]]
name = "DataTransformationSpec"
layer = "Flow"
category = "Behavior"
description = "P2 — Data shape transformation (DataTransformation). Defines input_schema to output_schema with mapping_rules."

[[elements]]
name = "SchemaDefinitionData"
layer = "Flow"
category = "PassiveStructure"
description = "P2 — Data shape definition (SchemaDefinition). Has id, name, schema_format, and definition dict."

[[elements]]
name = "StepSchemaUsageSpec"
layer = "Flow"
category = "PassiveStructure"
description = "P2 — Step data contract (StepSchemaUsage). Declares input/output_schema_id and required_fields for a step."

[[elements]]
name = "FlowOntologyRegistry"
layer = "Flow"
category = "ActiveStructure"
description = "P2 — Registry for process specification types (FlowOntology). Static describe() method enumerates registered types."

[[elements]]
name = "FlowStepCategoryEnum"
layer = "Flow"
category = "Assessment"
description = "Step role classification enum (FlowStepCategory). Values: ACTION, DECISION, EVENT, GATEWAY, TRANSFORMATION."

# ─────────────────────────────────────────────────────────────
# P3 Realization Plane — Runtime Interpretation (runtime.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "RealizationPlane"
layer = "Flow"
category = "Composite"
description = "P3 Realization plane — container for runtime interpreter, implementers, and execution results."

[[elements]]
name = "FlowRuntimeEngine"
layer = "Flow"
category = "ActiveStructure"
description = "P3 — Workflow interpreter (FlowRuntime). Sequential step execution with compensating rollback on failure."

[[elements]]
name = "StepImplementerContract"
layer = "Flow"
category = "Interface"
description = "P3 — Abstract step execution interface (StepImplementer ABC). Defines execute() and rollback() — compensating transaction pattern."

[[elements]]
name = "StepInterpretationResultData"
layer = "Flow"
category = "PassiveStructure"
description = "P3 — Declarative interpretation result (StepInterpretationResult). Frozen dataclass with accepted, intent, logs."

[[elements]]
name = "StepExecutionResultData"
layer = "Flow"
category = "PassiveStructure"
description = "P3 — Backward-compatible alias (StepExecutionResult extends StepInterpretationResult). Same structure for legacy code."

[[elements]]
name = "FlowExecutionResultData"
layer = "Flow"
category = "PassiveStructure"
description = "P3 — Full workflow result (FlowExecutionResult). Contains workflow_name, execution_id, success, step_results, rollback_occurred."

# ─────────────────────────────────────────────────────────────
# S5 Evolution Plane — Topology What-If Simulation (flow_simulator.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "FlowSimulatorEngine"
layer = "Flow"
category = "ActiveStructure"
description = "S5 — Topology change impact simulator (FlowSimulator). Replays execution history against topology change sets before applying."

[[elements]]
name = "TopologyChangeRequest"
layer = "Flow"
category = "PassiveStructure"
description = "S5 — Topology change request (TopologyChange). Encodes change_type, step_name, workflow_name, new_position, and optional start_condition."

[[elements]]
name = "TopologyChangeTypeEnum"
layer = "Flow"
category = "Assessment"
description = "S5 — Topology change type enum (TopologyChangeType). Values: ADD_STEP, REMOVE_STEP, REORDER_STEP, PATCH_START_CONDITION."

[[elements]]
name = "StartConditionSpecData"
layer = "Flow"
category = "Assessment"
description = "S5 — Explicit start condition contract (StartConditionSpec). Encodes target/source step, kind, optional field mapping, optional condition expression, and canonical identifier."

[[elements]]
name = "StartConditionKindEnum"
layer = "Flow"
category = "Assessment"
description = "S5 — Start condition edge kind enum (StartConditionKind). Values: CONTROL_EDGE, DATA_EDGE, EVENT_TRIGGER."

[[elements]]
name = "TopologySimulationResultData"
layer = "Flow"
category = "PassiveStructure"
description = "S5 — Topology simulation result (TopologySimulationResult). Reports affected executions, impact level, dependency/start-condition violations, risk factors, and safe_to_apply."

# ─────────────────────────────────────────────────────────────
# Schema Plane — Schema Specifications (schema.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "SchemaSpecContract"
layer = "Flow"
category = "Interface"
description = "Schema specification interface (SchemaSpec ABC). Defines validate() and to_dict() for format-specific schema implementations."

[[elements]]
name = "JsonSchema2020SpecType"
layer = "Flow"
category = "ActiveStructure"
description = "JSON Schema 2020-12 implementation (JsonSchema2020Spec). Validates data against raw JSON Schema using jsonschema library."

[[elements]]
name = "DbSchemaSpecType"
layer = "Flow"
category = "ActiveStructure"
description = "Database schema implementation (DbSchemaSpec). DDL-approach table/view schema with table_name, columns, and optional ddl."

# ─────────────────────────────────────────────────────────────
# Data Schema Catalog — Step I/O Contracts & Data Lineage
# ─────────────────────────────────────────────────────────────
# Flow의 핵심 역할: 스텝 간 입출력 데이터 스키마를 정의·검증·추적한다.
# P1에서 스텝별 입출력 형태 선언, P2에서 스키마 매칭/버전/호환성 조율,
# P3에서 런타임 데이터 계보 추적.

# --- P1: 스텝별 입출력 스키마 선언 ---

[[elements]]
name = "StepInputSchemaData"
layer = "Flow"
category = "PassiveStructure"
description = "P1 — Formal input data shape per step. Declares field names, types, required/optional flags, and default values consumed by a step."

[[elements]]
name = "StepOutputSchemaData"
layer = "Flow"
category = "PassiveStructure"
description = "P1 — Formal output data shape per step. Declares field names, types, and guarantees produced by a step upon successful execution."

# --- P2: 스키마 매칭·버전·카탈로그 ---

[[elements]]
name = "DataContractSpec"
layer = "Flow"
category = "PassiveStructure"
description = "P2 — Producer-consumer schema matching contract. Binds a producer step's output schema to a consumer step's input schema with compatibility_mode (strict/compatible/relaxed)."

[[elements]]
name = "SchemaVersionRecord"
layer = "Flow"
category = "PassiveStructure"
description = "P2 — Schema version metadata. Tracks version_id, parent_version, change_type (additive/breaking/compatible), and migration_hint for schema evolution."

[[elements]]
name = "DataCatalogRegistry"
layer = "Flow"
category = "ActiveStructure"
description = "P2 — Flow-owned registry of all data schemas used across steps and workflows. Provides lookup by schema_id, version, and compatibility queries."

[[elements]]
name = "SchemaCompatibilityRule"
layer = "Flow"
category = "Assessment"
description = "P2 — Schema evolution compatibility rule. Evaluates whether a schema change (additive/breaking/compatible) is safe for existing consumers."

[[elements]]
name = "DataQualityGate"
layer = "Flow"
category = "Assessment"
description = "P2 — Data quality validation constraint at schema boundary. Enforces nullability, range, format, and cross-field consistency rules on step input/output."

# --- P3: 런타임 데이터 계보 ---

[[elements]]
name = "DataLineageRecord"
layer = "Flow"
category = "PassiveStructure"
description = "P3 — Data provenance record. Tracks which step produced each data field, the schema version used, and the transformation path through the flow."

# ─────────────────────────────────────────────────────────────
# Kernel Actions — Kernel-Linked Step Specs (kernel_actions.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "AddRuleStepSpecType"
layer = "Flow"
category = "Executable"
description = "Kernel action — declarative step spec for adding a new rule (AddRuleStepSpec). Carries rule_asset_data and kernel_anchor."

[[elements]]
name = "DeprecateRuleStepSpecType"
layer = "Flow"
category = "Executable"
description = "Kernel action — declarative step spec for deprecating a rule (DeprecateRuleStepSpec). Carries rule_id and kernel_anchor."

# ─────────────────────────────────────────────────────────────
# Kernel Implementers — Runtime Executors (kernel_implementers.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "AddRuleImplementerType"
layer = "Flow"
category = "Executable"
description = "P3 — Kernel rule creation implementer (AddRuleImplementer). Interprets AddRuleStepSpec into kernel.submit_rule intent."

[[elements]]
name = "DeprecateRuleImplementerType"
layer = "Flow"
category = "Executable"
description = "P3 — Kernel rule deprecation implementer (DeprecateRuleImplementer). Interprets DeprecateRuleStepSpec into kernel.deprecate_rule intent."

# ─────────────────────────────────────────────────────────────
# Flow Profile — Meta-Step Collection (profile.py)
# ─────────────────────────────────────────────────────────────

[[elements]]
name = "FlowProfileType"
layer = "Flow"
category = "Composite"
description = "Domain-specific meta-step collection (FlowProfile). Frozen dataclass with name, version, meta_steps tuple, metadata."

# =============================================================
