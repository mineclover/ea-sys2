# ══════════════════════════════════════════════════════════════
# RULES: Category-Level Structure (재귀 패턴 핵심)
# ══════════════════════════════════════════════════════════════

# ── Node 구성: Node contains I/O + Logic ─────────────────────

[[rules]]
id = "rn-struct-01"
source = "@Composite"
target = "@InputInterface"
relation = "contains"
priority = 50
notes = "Every Node contains its InputPorts."

[[rules]]
id = "rn-struct-02"
source = "@Composite"
target = "@OutputInterface"
relation = "contains"
priority = 50
notes = "Every Node contains its OutputPorts."

[[rules]]
id = "rn-struct-03"
source = "@Composite"
target = "@Behavior"
relation = "contains"
priority = 50
notes = "Every Node contains its Logic container."

# ── 재귀: Logic contains Nodes ───────────────────────────────

[[rules]]
id = "rn-recurse-01"
source = "@Behavior"
target = "@Composite"
relation = "contains"
priority = 50
notes = "Logic contains sub-Nodes (recursion)."

# ── 재귀: Logic contains QualityGates ────────────────────────

[[rules]]
id = "rn-recurse-02"
source = "@Behavior"
target = "@Assessment"
relation = "contains"
priority = 50
notes = "Logic can contain quality gates."

# ── 데이터 흐름: Output → Input (cross-boundary wiring) ──────

[[rules]]
id = "rn-wire-01"
source = "@OutputInterface"
target = "@InputInterface"
relation = "next"
priority = 50
scope = "sibling"
notes = "Cross-boundary data wiring: OutputPort → InputPort (same container only)."

# ── 데이터 생산/소비 ─────────────────────────────────────────

[[rules]]
id = "rn-data-01"
source = "@Composite"
target = "@PassiveStructure"
relation = "produces"
priority = 50
notes = "Node produces DataChannel."

[[rules]]
id = "rn-data-02"
source = "@Composite"
target = "@PassiveStructure"
relation = "consumes"
priority = 50
notes = "Node consumes DataChannel."

[[rules]]
id = "rn-data-03"
source = "@OutputInterface"
target = "@PassiveStructure"
relation = "produces"
priority = 50
notes = "OutputPort produces DataChannel."

[[rules]]
id = "rn-data-04"
source = "@InputInterface"
target = "@PassiveStructure"
relation = "consumes"
priority = 50
notes = "InputPort consumes DataChannel."

# ── 제약/조율 ────────────────────────────────────────────────

[[rules]]
id = "rn-gate-01"
source = "@Assessment"
target = "@Composite"
relation = "constrains"
priority = 50
notes = "QualityGate constrains Node execution."

[[rules]]
id = "rn-coord-01"
source = "@Composite"
target = "@Composite"
relation = "coordinates"
priority = 50
notes = "Nodes coordinate with each other."

[[rules]]
id = "rn-dep-01"
source = "@Composite"
target = "@Composite"
relation = "depends_on"
priority = 50
notes = "Structural dependency between Nodes."

[[rules]]
